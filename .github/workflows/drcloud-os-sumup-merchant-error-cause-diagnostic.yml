name: DrCloud OS SumUp merchant error cause diagnostic

on:
  workflow_run:
    workflows: ["DrCloud OS SumUp merchant watermark diagnostic"]
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: drcloud-os-sumup-merchant-error-cause-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    env:
      REVIEWED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Validate reviewed SHA
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out exact reviewed SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEWED_SHA }}

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          SSH_HOST_KEYS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/drcloud_deploy
          printf '%s\n' "$SSH_HOST_KEYS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/drcloud_deploy ~/.ssh/known_hosts

      - name: Capture bounded SumUp merchant error cause
        id: capture
        continue-on-error: true
        env:
          OVH_SSH_HOST: ${{ secrets.OVH_SSH_HOST }}
          OVH_SSH_PORT: ${{ secrets.OVH_SSH_PORT }}
          OVH_SSH_USER: ${{ secrets.OVH_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/drcloud_deploy -p "${OVH_SSH_PORT:-22}" "$OVH_SSH_USER@$OVH_SSH_HOST" \
            "EXPECTED_DEPLOYED_SHA='$REVIEWED_SHA' bash -s" > sumup_merchant_error_cause.json <<'REMOTE'
          set -Eeuo pipefail
          repo=/opt/drcloud-os
          expected_sha="${EXPECTED_DEPLOYED_SHA:-}"
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || { echo SUMUP_MERCHANT_ERROR_CAUSE_EXPECTED_SHA_INVALID >&2; exit 64; }
          source "$repo/deploy/ovh/deployment-environment.sh"
          exec 9>"${DRCLOUD_DEPLOY_LOCK:-/tmp/drcloud-os-deploy.lock}"
          flock 9
          deployed_sha="$(git -C "$repo" rev-parse HEAD)"
          [[ "$deployed_sha" == "$expected_sha" ]] || { echo SUMUP_MERCHANT_ERROR_CAUSE_DEPLOYED_SHA_MISMATCH >&2; exit 65; }
          cd "$repo/deploy/ovh"
          docker compose exec -T drcloud-os env -i \
            PATH=/usr/local/bin:/usr/bin:/bin \
            DRCLOUD_DATA_DIR=/data \
            EXPECTED_DEPLOYED_SHA="$expected_sha" \
            python - <<'PY'
          import json, os, re, sqlite3
          from pathlib import Path

          sha=os.environ.get('EXPECTED_DEPLOYED_SHA','')
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('SUMUP_MERCHANT_ERROR_CAUSE_EXPECTED_SHA_INVALID')
          db_path=Path(os.environ.get('DRCLOUD_DATA_DIR','/data'))/'drcloud.db'
          if not db_path.is_file():
              raise SystemExit('SUMUP_MERCHANT_ERROR_CAUSE_LEDGER_MISSING')

          categories={'AUTH','HTTP','TIMEOUT','NETWORK','PARSING','RATE_LIMIT','INVALID_RESPONSE','VALIDATION','CONFIGURATION','PERSISTENCE','WAF','UNKNOWN'}
          source_statuses={'CONNECTED','PARTIAL','NOT_CONFIGURED','DISABLED','ERROR','UNSUPPORTED','UNAVAILABLE','UNKNOWN'}
          job_statuses={'PENDING','RUNNING','SUCCEEDED','FAILED','BLOCKED','RETRY','UNKNOWN'}
          run_statuses={'RUNNING','SUCCEEDED','FAILED','BLOCKED','RETRY','UNKNOWN'}

          def bounded(value, allowed):
              text=str(value or '').upper()
              return text if text in allowed else 'UNKNOWN'
          def stage_family(value):
              text=str(value or '').lower()
              if text in {'authentication','startup_health'}: return 'AUTHENTICATION'
              if text == 'merchant_profile': return 'MERCHANT_PROFILE'
              if text == 'execution': return 'EXECUTION'
              if text in {'parsing','pagination'}: return text.upper()
              return 'OTHER'
          def http_class(value):
              if value is None: return 'NONE'
              try: code=int(value)
              except (TypeError, ValueError): return 'OTHER_HTTP'
              if code in (401,403): return 'AUTH_401_403'
              if code == 404: return 'NOT_FOUND_404'
              if code == 429: return 'RATE_LIMIT_429'
              if 500 <= code < 600: return 'SERVER_5XX'
              if 400 <= code < 500: return 'CLIENT_4XX_OTHER'
              if 200 <= code < 400: return 'NON_ERROR_HTTP'
              return 'OTHER_HTTP'
          def operation_family(value):
              text=str(value or '').upper()
              if text == 'SUMUP_MERCHANT': return 'SUMUP_MERCHANT'
              if 'HEALTH' in text or text == 'AUTHENTICATION': return 'HEALTH_OR_AUTH'
              return 'OTHER'

          db=sqlite3.connect(f"{db_path.resolve().as_uri()}?mode=ro",uri=True)
          db.row_factory=sqlite3.Row
          try:
              tables={r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              required={'data_sources','sync_jobs','data_hub_sync_runs','connector_diagnostics'}
              if not required <= tables:
                  raise SystemExit('SUMUP_MERCHANT_ERROR_CAUSE_SCHEMA_INCOMPLETE')
              source=db.execute("SELECT status,enabled FROM data_sources WHERE source_id='sumup_merchant'").fetchone()
              job=db.execute("SELECT status FROM sync_jobs WHERE job_id='sync_sumup_merchant' AND source_id='sumup_merchant' AND job_type='SUMUP_MERCHANT'").fetchone()
              run=db.execute("SELECT status FROM data_hub_sync_runs WHERE job_id='sync_sumup_merchant' ORDER BY run_id DESC LIMIT 1").fetchone()
              diagnostic=db.execute("SELECT category,stage,http_status,operation,success FROM connector_diagnostics WHERE source_id='sumup_merchant' ORDER BY diagnostic_id DESC LIMIT 1").fetchone()
              report={
                  'schema_version':1,
                  'environment':'production',
                  'result':'SUMUP_MERCHANT_ERROR_CAUSE_DIAGNOSTIC',
                  'deployed_sha':sha,
                  'evidence_status':'MEASURABLE',
                  'provider_exhaustiveness_inferred':False,
                  'rpo_projection_authorized':False,
                  'imported_at_used_as_business_progress':False,
                  'evidence':{
                      'source_present':source is not None,
                      'source_enabled':bool(source['enabled']) if source else False,
                      'source_status':bounded(source['status'],source_statuses) if source else 'UNKNOWN',
                      'job_present':job is not None,
                      'job_status':bounded(job['status'],job_statuses) if job else 'UNKNOWN',
                      'latest_run_present':run is not None,
                      'latest_run_status':bounded(run['status'],run_statuses) if run else 'UNKNOWN',
                      'diagnostic_present':diagnostic is not None,
                      'diagnostic_success':bool(diagnostic['success']) if diagnostic else False,
                      'category':bounded(diagnostic['category'],categories) if diagnostic else 'UNKNOWN',
                      'stage_family':stage_family(diagnostic['stage']) if diagnostic else 'OTHER',
                      'http_status_class':http_class(diagnostic['http_status']) if diagnostic else 'NONE',
                      'operation_family':operation_family(diagnostic['operation']) if diagnostic else 'OTHER',
                  },
                  'safety':{
                      'database_read_only':True,
                      'provider_network_calls':False,
                      'external_provider_auth':'NONE',
                      'provider_mutations':False,
                      'raw_error_values_emitted':False,
                      'timestamp_values_emitted':False,
                      'merchant_identifiers_emitted':False,
                      'endpoint_paths_emitted':False,
                      'provider_payloads_emitted':False,
                      'credentials_or_pii_emitted':False,
                  },
              }
              print(json.dumps(report,indent=2,sort_keys=True))
          finally:
              db.close()
          PY
          REMOTE
          test -s sumup_merchant_error_cause.json

      - name: Upload sanitized error-cause evidence
        id: upload
        if: always() && hashFiles('sumup_merchant_error_cause.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: drcloud-sumup-merchant-error-cause-${{ github.run_id }}
          path: sumup_merchant_error_cause.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce bounded evidence contract
        id: enforce
        if: always()
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          test "$CAPTURE_OUTCOME" = success
          test "$UPLOAD_OUTCOME" = success
          test -s sumup_merchant_error_cause.json
          python - <<'PY'
          import json, os
          d=json.load(open('sumup_merchant_error_cause.json'))
          assert d['schema_version']==1
          assert d['environment']=='production'
          assert d['result']=='SUMUP_MERCHANT_ERROR_CAUSE_DIAGNOSTIC'
          assert d['deployed_sha']==os.environ['REVIEWED_SHA']
          assert d['evidence_status']=='MEASURABLE'
          assert d['provider_exhaustiveness_inferred'] is False
          assert d['rpo_projection_authorized'] is False
          assert d['imported_at_used_as_business_progress'] is False
          e=d['evidence']
          assert set(e)=={'source_present','source_enabled','source_status','job_present','job_status','latest_run_present','latest_run_status','diagnostic_present','diagnostic_success','category','stage_family','http_status_class','operation_family'}
          assert e['category'] in {'AUTH','HTTP','TIMEOUT','NETWORK','PARSING','RATE_LIMIT','INVALID_RESPONSE','VALIDATION','CONFIGURATION','PERSISTENCE','WAF','UNKNOWN'}
          assert e['stage_family'] in {'AUTHENTICATION','MERCHANT_PROFILE','EXECUTION','PARSING','PAGINATION','OTHER'}
          assert e['http_status_class'] in {'NONE','AUTH_401_403','NOT_FOUND_404','RATE_LIMIT_429','SERVER_5XX','CLIENT_4XX_OTHER','NON_ERROR_HTTP','OTHER_HTTP'}
          assert e['operation_family'] in {'SUMUP_MERCHANT','HEALTH_OR_AUTH','OTHER'}
          assert d['safety']=={
              'database_read_only':True,
              'provider_network_calls':False,
              'external_provider_auth':'NONE',
              'provider_mutations':False,
              'raw_error_values_emitted':False,
              'timestamp_values_emitted':False,
              'merchant_identifiers_emitted':False,
              'endpoint_paths_emitted':False,
              'provider_payloads_emitted':False,
              'credentials_or_pii_emitted':False,
          }
          PY

      - name: Index this run for connector discovery
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          ENFORCE_OUTCOME: ${{ steps.enforce.outcome }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python - <<'PY'
          import datetime,json,os
          conclusion='success' if os.environ.get('CAPTURE_OUTCOME')=='success' and os.environ.get('UPLOAD_OUTCOME')=='success' and os.environ.get('ENFORCE_OUTCOME')=='success' else 'failure'
          row={'schema_version':1,'workflow':'DrCloud OS SumUp merchant error cause diagnostic','run_id':int(os.environ['GITHUB_RUN_ID']),'run_number':int(os.environ['GITHUB_RUN_NUMBER']),'run_attempt':int(os.environ.get('GITHUB_RUN_ATTEMPT','1')),'status':'completed','conclusion':conclusion,'event':os.environ.get('GITHUB_EVENT_NAME'),'head_branch':'main','head_sha':os.environ['REVIEWED_SHA'],'indexed_at':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),'run_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",'trigger_run_id':int(os.environ['TRIGGER_RUN_ID'])}
          body='<!-- drcloud-run-index -->\n```json\n'+json.dumps(row,sort_keys=True)+'\n```'
          json.dump({'body':body},open('run-index-payload.json','w'))
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/170/comments" --input run-index-payload.json
