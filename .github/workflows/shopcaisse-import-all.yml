name: Import final PrestaShop vers ShopCaisse

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Saisir exactement IMPORT-ALL pour autoriser l'import final"
        required: true
        type: string

permissions:
  contents: read

jobs:
  import-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Initialiser le rapport publiable
        run: |
          mkdir -p dist
          printf '%s\n' '{"mode":"IMPORT_ALL","candidats":0,"creations_effectuees":0,"skipped":0,"failed":0,"arret_sur_echec":false,"termine":false,"resultats":[]}' > dist/rapport-import-final-shopcaisse.json
      - name: Vérifier la confirmation et la configuration
        env:
          CONFIRM: ${{ inputs.confirm }}
          SHOPCAISSE_API_KEY: ${{ secrets.SHOPCAISSE_API_KEY }}
          PRESTASHOP_API_KEY: ${{ secrets.PRESTASHOP_API_KEY }}
          SHOPCAISSE_COMPANY_ID: ${{ vars.SHOPCAISSE_COMPANY_ID }}
        run: |
          test "$CONFIRM" = "IMPORT-ALL" || { echo "Confirmation incorrecte; zéro écriture." >&2; exit 1; }
          test -n "$SHOPCAISSE_API_KEY" || { echo "SHOPCAISSE_API_KEY est absent" >&2; exit 1; }
          test -n "$PRESTASHOP_API_KEY" || { echo "PRESTASHOP_API_KEY est absent" >&2; exit 1; }
          test -n "$SHOPCAISSE_COMPANY_ID" || { echo "SHOPCAISSE_COMPANY_ID est absent" >&2; exit 1; }
      - name: Installer et tester les barrières
        run: |
          python -m pip install . pytest
          python -m pytest -q
      - name: Exécuter l'import final
        env:
          SHOPCAISSE_API_KEY: ${{ secrets.SHOPCAISSE_API_KEY }}
          PRESTASHOP_API_KEY: ${{ secrets.PRESTASHOP_API_KEY }}
          SHOPCAISSE_COMPANY_ID: ${{ vars.SHOPCAISSE_COMPANY_ID }}
          SHOPCAISSE_IMPORT_CONFIRM: ${{ inputs.confirm }}
        run: dr-cloud-sync shopcaisse-import-all
      - name: Publier le rapport sans secret
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-import-final-shopcaisse
          if-no-files-found: error
          path: dist/rapport-import-final-shopcaisse.json
