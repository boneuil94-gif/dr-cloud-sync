name: DrCloud OS Run Index

on:
  workflow_run:
    workflows:
      - DrCloud OS encrypted offsite backup
      - DrCloud OS remote-only recovery Game Day
      - DrCloud OS production bootstrap proof
      - DrCloud OS Recovery Game Day
      - DrCloud OS Production
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/drcloud-os-run-index.yml

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: drcloud-os-run-index
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish sanitized run locator
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          INDEX_ISSUE: "170"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone

          repo = os.environ["REPOSITORY"]
          issue = os.environ["INDEX_ISSUE"]
          event_name = os.environ["EVENT_NAME"]
          allowed = {
              "DrCloud OS encrypted offsite backup",
              "DrCloud OS remote-only recovery Game Day",
              "DrCloud OS production bootstrap proof",
              "DrCloud OS Recovery Game Day",
              "DrCloud OS Production",
          }

          def publish(run):
              name = str(run.get("name") or "")
              if name not in allowed:
                  return
              safe = {
                  "schema_version": 1,
                  "workflow": name,
                  "run_id": int(run["id"]),
                  "run_number": int(run.get("run_number") or 0),
                  "run_attempt": int(run.get("run_attempt") or 1),
                  "status": str(run.get("status") or "UNKNOWN"),
                  "conclusion": str(run.get("conclusion") or "UNKNOWN"),
                  "event": str(run.get("event") or "UNKNOWN"),
                  "head_branch": str(run.get("head_branch") or ""),
                  "head_sha": str(run.get("head_sha") or ""),
                  "created_at": str(run.get("created_at") or ""),
                  "updated_at": str(run.get("updated_at") or ""),
                  "run_url": f"https://github.com/{repo}/actions/runs/{int(run['id'])}",
                  "indexed_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              }
              body = "<!-- drcloud-run-index -->\n```json\n" + json.dumps(safe, sort_keys=True) + "\n```"
              subprocess.run(
                  ["gh", "api", f"repos/{repo}/issues/{issue}/comments", "-f", f"body={body}"],
                  check=True,
                  stdout=subprocess.DEVNULL,
              )

          if event_name == "workflow_run":
              event = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
              publish(event["workflow_run"])
          else:
              raw = subprocess.check_output(
                  ["gh", "api", f"repos/{repo}/actions/runs?per_page=100"], text=True
              )
              runs = json.loads(raw).get("workflow_runs", [])
              seen = set()
              for run in runs:
                  name = str(run.get("name") or "")
                  if name in allowed and name not in seen:
                      publish(run)
                      seen.add(name)
              missing = allowed - seen
              if missing:
                  print("RUN_INDEX_PARTIAL:" + ",".join(sorted(missing)))
          PY
