name: Apply recorded-only run_due containment patch

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sumup-merchant-readers-jobs
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e . pytest
      - name: Apply exact recorded-only containment edit
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path("src/dr_cloud_sync/data_hub.py")
          text=path.read_text(encoding="utf-8")
          old='''                except Exception:\n                    # ``run`` already records a sanitized FAILED run/source diagnostic.\n                    # Keep the worker cycle alive so an optional provider scope cannot\n                    # starve unrelated core synchronization jobs.\n                    results.append(self.job(job["job_id"]))'''
          new='''                except Exception:\n                    # Contain only failures that ``run`` has already persisted.\n                    # Scheduler/SQLite faults raised before that point stay visible\n                    # to the worker's outer failure handler instead of disappearing.\n                    recorded=self.job(job["job_id"])\n                    if not recorded or recorded["status"] not in {SyncStatus.FAILED,SyncStatus.RETRY}:\n                        raise\n                    results.append(recorded)'''
          if text.count(old) != 1:
              raise SystemExit("run_due containment anchor changed; refusing broad edit")
          path.write_text(text.replace(old,new,1),encoding="utf-8")
          PY
          git rm .github/workflows/patch-run-due-recorded-only.yml
      - name: Run focused scheduler and SumUp tests
        run: python -m pytest -q tests/test_data_hub_run_due_isolation.py tests/test_data_hub_run_due_unrecorded_failure.py tests/test_sumup_direct_jobs.py tests/test_sumup_connector.py
      - name: Commit bounded patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dr_cloud_sync/data_hub.py tests/test_data_hub_run_due_unrecorded_failure.py
          git commit -m "fix: contain only recorded due-job failures"
          git push origin HEAD:feat/sumup-merchant-readers-jobs
