name: Construire mapping PrestaShop ShopCaisse

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  mapping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Vérifier les secrets et variables
        env:
          PRESTASHOP_API_KEY: ${{ secrets.PRESTASHOP_API_KEY }}
          SHOPCAISSE_API_KEY: ${{ secrets.SHOPCAISSE_API_KEY }}
          SHOPCAISSE_COMPANY_ID: ${{ vars.SHOPCAISSE_COMPANY_ID }}
        run: |
          test -n "$PRESTASHOP_API_KEY" || { echo "PRESTASHOP_API_KEY est absent" >&2; exit 1; }
          test -n "$SHOPCAISSE_API_KEY" || { echo "SHOPCAISSE_API_KEY est absent" >&2; exit 1; }
          test -n "$SHOPCAISSE_COMPANY_ID" || { echo "SHOPCAISSE_COMPANY_ID est absent" >&2; exit 1; }
      - name: Installer et contrôler le générateur
        run: |
          python -m pip install . pytest
          python -m pytest -q
          python -m compileall -q src tests
      - name: Récupérer les rapports d'import disponibles en GET
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p dist /tmp/import-reports
          for artifact in rapport-import-pilote-shopcaisse rapport-import-controle-shopcaisse rapport-import-final-shopcaisse; do
            url=$(gh api --method GET "repos/$REPOSITORY/actions/artifacts?name=$artifact&per_page=1" --jq '.artifacts[0].archive_download_url // empty')
            if [ -n "$url" ]; then
              curl --fail --silent --show-error --location \
                --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" \
                "$url" --output "/tmp/import-reports/$artifact.zip"
              unzip -jo "/tmp/import-reports/$artifact.zip" '*.json' -d dist
            fi
          done
      - name: Récupérer les catalogues en GET et construire le mapping
        env:
          PRESTASHOP_API_KEY: ${{ secrets.PRESTASHOP_API_KEY }}
          SHOPCAISSE_API_KEY: ${{ secrets.SHOPCAISSE_API_KEY }}
          SHOPCAISSE_COMPANY_ID: ${{ vars.SHOPCAISSE_COMPANY_ID }}
          PRESTASHOP_API_URL: ${{ vars.PRESTASHOP_API_URL }}
        run: dr-cloud-sync build-catalog-mapping
      - name: Contrôler les fichiers publiés
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          mapping = json.loads(Path("dist/mapping-prestashop-shopcaisse.json").read_text())
          report = json.loads(Path("dist/rapport-mapping-prestashop-shopcaisse.json").read_text())
          assert len(mapping["mappings"]) == mapping["prestashop_total"]
          assert sum(mapping[k] for k in ("certaine", "probable", "ambigue", "non_trouvee", "conflit")) == mapping["prestashop_total"]
          assert report["prestashop_total"] == mapping["prestashop_total"]
          PY
      - name: Publier la table et le rapport
        uses: actions/upload-artifact@v4
        with:
          name: mapping-prestashop-shopcaisse
          if-no-files-found: error
          path: |
            dist/mapping-prestashop-shopcaisse.json
            dist/rapport-mapping-prestashop-shopcaisse.json
