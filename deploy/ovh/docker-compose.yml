name: drcloud-os

services:
  drcloud-os:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        DRCLOUD_BUILD_COMMIT: ${DRCLOUD_BUILD_COMMIT:-unknown}
        DRCLOUD_BUILD_DATE: ${DRCLOUD_BUILD_DATE:-unknown}
    image: drcloud-os:local
    restart: unless-stopped
    env_file:
      - ./drcloud.env
    environment:
      DRCLOUD_BACKUP_DIR: /data/backups
      DRCLOUD_DEPLOYMENT_MARKER: /run/drcloud-deployment/last-successful-commit
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - drcloud-data:/data
      - ${DRCLOUD_DEPLOYMENT_STATE_DIR:?set by deploy.sh}:/run/drcloud-deployment:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  automation-worker:
    image: drcloud-os:local
    command: ["dr-cloud-sync", "automation-worker"]
    restart: unless-stopped
    env_file: [./drcloud.env]
    environment:
      DRCLOUD_BACKUP_DIR: /data/backups
    volumes:
      - drcloud-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3,os; sqlite3.connect('/data/drcloud.db').execute('select 1')"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  drcloud-data:
    name: drcloud-data
