name: Simulation import PrestaShop vers ShopCaisse

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Vérifier le secret
        env:
          SHOPCAISSE_API_KEY: ${{ secrets.SHOPCAISSE_API_KEY }}
          PRESTASHOP_API_KEY: ${{ secrets.PRESTASHOP_API_KEY }}
        run: |
          test -n "$SHOPCAISSE_API_KEY" || { echo "SHOPCAISSE_API_KEY est absent" >&2; exit 1; }
          test -n "$PRESTASHOP_API_KEY" || { echo "PRESTASHOP_API_KEY est absent" >&2; exit 1; }
      - name: Installer et vérifier la barrière GET
        run: |
          python -m pip install . pytest
          python -m pytest -q
      - name: Exécuter uniquement la simulation
        env:
          SHOPCAISSE_API_KEY: ${{ secrets.SHOPCAISSE_API_KEY }}
          PRESTASHOP_API_KEY: ${{ secrets.PRESTASHOP_API_KEY }}
          PRESTASHOP_API_URL: ${{ vars.PRESTASHOP_API_URL || 'https://dr-cloudshop.com/api' }}
        run: dr-cloud-sync shopcaisse-import-dry-run
      - name: Publier le dry-run
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-import-shopcaisse
          if-no-files-found: error
          path: |
            dist/plan-import-prestashop-shopcaisse.json
            dist/dry-run-import-shopcaisse.json
            dist/rapport-dry-run-import.json
            dist/catalogue-prestashop-reconstruit.json
