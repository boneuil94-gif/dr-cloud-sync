<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventaire DRCloud</title><link rel="stylesheet" href="/inventory.css"></head>
<body><header><h1>INVENTAIRE <b>DRCloud</b></h1><div class="stats"><strong id="ratio">0 / 478</strong><span id="remaining">478 restants</span><span id="percent">0 %</span></div><progress id="progress" max="478" value="0"></progress></header>
<main><section class="scanner"><div class="modes"><button id="quantityMode" class="active">Quantité</button><button id="plusMode">+1</button></div><label for="search">Scanner ou rechercher un article</label><div class="scanrow"><input id="search" autofocus autocomplete="off" inputmode="search" placeholder="EAN, nom, référence, clé…"><button id="camera" title="Scanner avec la caméra">📷</button></div><video id="video" hidden playsinline></video><p id="message" role="status"></p></section>
<section id="selected" hidden><h2 id="productName"></h2><dl id="details"></dl><button id="stocks">Afficher stocks théoriques</button><div id="stockValues" hidden></div><form id="countForm"><label>Quantité physique<input id="quantity" type="number" min="0" step="1" required></label><button type="submit">✓ Enregistrer</button></form></section>
<nav><button data-view="ALL" class="active">Tous</button><button data-view="COUNTED">Comptés</button><button data-view="REMAINING">À compter</button><button id="noEan">Sans EAN</button></nav><section id="results"></section>
<footer><a href="/api/export.csv">Exporter CSV</a><a href="/api/report" download="rapport-inventaire-drcloud.json">Exporter JSON</a><button id="complete">TERMINER LE COMPTAGE</button></footer></main><script src="/inventory.js"></script></body></html>
