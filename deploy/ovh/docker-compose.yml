name: drcloud-os

services:
  drcloud-os:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        DRCLOUD_BUILD_COMMIT: ${DRCLOUD_BUILD_COMMIT:-unknown}
        DRCLOUD_BUILD_DATE: ${DRCLOUD_BUILD_DATE:-unknown}
    image: drcloud-os:local
    restart: unless-stopped
    env_file:
      - ./drcloud.env
    environment:
      DRCLOUD_DEPLOYMENT_MARKER: /run/drcloud-deployment/last-successful-commit
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - drcloud-data:/data
      - ${DRCLOUD_BACKUP_ROOT:-/var/backups/drcloud}:/backups
      - ${DRCLOUD_DEPLOYMENT_STATE_DIR:-./.deployment-state}:/run/drcloud-deployment:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  drcloud-data:
    name: drcloud-data
