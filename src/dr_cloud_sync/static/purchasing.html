<main class="dc-main purchasing-page"><header class="dc-page-header"><div><p class="dc-eyebrow">OPÉRATIONS</p><h1>Achats</h1><p>Fournisseurs et commandes fournisseur</p></div><button class="dc-button" id="primaryAction">Nouveau fournisseur</button></header>
<nav class="purchasing-tabs" aria-label="Sous-domaines Achats"><button data-tab="suppliers" class="active">Fournisseurs <small>Disponible</small></button><button data-tab="orders">Commandes <small>Disponible</small></button><button data-tab="receipts">Réceptions <small>Disponible</small></button><span>Réassort <small>À venir</small></span></nav>
<section id="suppliersPanel" class="dc-card supplier-panel"><div class="supplier-tools"><label>Rechercher<input class="dc-input" id="supplierSearch" type="search" placeholder="Nom, contact, email ou téléphone"></label><label>Statut<select class="dc-select" id="supplierStatus"><option value="">Tous</option><option value="ACTIVE">Actifs</option><option value="INACTIVE">Inactifs</option><option value="ARCHIVED">Archivés</option></select></label></div><p class="dc-alert dc-alert-danger" id="supplierError" role="alert" hidden></p><div id="supplierContent" aria-live="polite"></div></section>
<section id="ordersPanel" class="dc-card supplier-panel" hidden><div class="supplier-tools"><label>Rechercher<input class="dc-input" id="orderSearch" type="search" placeholder="Référence ou fournisseur"></label><label>Statut<select class="dc-select" id="orderStatus"><option value="">Toutes</option><option value="DRAFT">Brouillons</option><option value="ORDERED">Commandées</option><option value="CANCELLED">Annulées</option></select></label></div><p class="dc-alert dc-alert-danger" id="orderError" role="alert" hidden></p><div id="orderContent" aria-live="polite"></div></section>
<section id="receiptsPanel" class="dc-card supplier-panel" hidden><h2>Réceptions fournisseur</h2><p>Historique immuable des marchandises confirmées.</p><div id="receiptContent" aria-live="polite"></div></section>
<dialog id="supplierDialog"><form method="dialog" id="supplierForm"><header><h2 id="formTitle">Nouveau fournisseur</h2><button value="cancel" aria-label="Fermer">×</button></header><input type="hidden" id="supplierId"><div class="supplier-form-grid"><label>Nom *<input class="dc-input" name="name" required maxlength="200"></label><label>Contact<input class="dc-input" name="contact_name" maxlength="200"></label><label>Email<input class="dc-input" name="email" type="email"></label><label>Téléphone<input class="dc-input" name="phone"></label><label>Site web<input class="dc-input" name="website" type="url"></label><label>Adresse<input class="dc-input" name="address"></label><label>Code postal<input class="dc-input" name="postal_code"></label><label>Ville<input class="dc-input" name="city"></label><label>Pays<input class="dc-input" name="country"></label><label class="wide">Notes<textarea class="dc-input" name="notes"></textarea></label></div><p id="formError" class="dc-alert dc-alert-danger" role="alert" hidden></p><footer><button value="cancel" class="dc-button dc-button-secondary">Annuler</button><button value="save" class="dc-button">Enregistrer</button></footer></form></dialog>
<dialog id="detailDialog"><article id="supplierDetail"></article><form method="dialog"><button class="dc-button dc-button-secondary">Fermer</button></form></dialog>
<dialog id="orderDialog"><form method="dialog" id="orderForm"><header><h2>Nouvelle commande</h2><button value="cancel" aria-label="Fermer">×</button></header><div class="supplier-form-grid"><label>Fournisseur actif *<select class="dc-select" name="supplier_id" id="orderSupplier" required></select></label><label>Référence interne<input class="dc-input" name="reference" placeholder="Générée automatiquement"></label><label>Référence fournisseur<input class="dc-input" name="supplier_reference"></label><label>Date attendue<input class="dc-input" name="expected_at" type="date"></label><label class="wide">Notes<textarea class="dc-input" name="notes"></textarea></label></div><p id="orderFormError" class="dc-alert dc-alert-danger" role="alert" hidden></p><footer><button value="cancel" class="dc-button dc-button-secondary">Annuler</button><button value="save" class="dc-button">Enregistrer le brouillon</button></footer></form></dialog>
<dialog id="orderDetailDialog"><article id="orderDetail"></article><form method="dialog"><button class="dc-button dc-button-secondary">Fermer</button></form></dialog><dialog id="receiptDialog"><form id="receiptForm"><header><h2>Réceptionner la commande</h2><button type="button" data-close-receipt aria-label="Fermer">×</button></header><p>Vérifiez les quantités réellement reçues avant de confirmer.</p><div id="receivableLines" class="receipt-cards"></div><label>Notes<textarea class="dc-input" name="notes"></textarea></label><p id="receiptError" class="dc-alert dc-alert-danger" hidden></p><footer><button type="button" class="dc-button dc-button-secondary" data-close-receipt>Annuler</button><button class="dc-button">Confirmer la réception</button></footer></form></dialog><dialog id="receiptDetailDialog"><article id="receiptDetail"></article><form method="dialog"><button class="dc-button dc-button-secondary">Fermer</button></form></dialog></main>
