name: DrCloud OS SumUp merchant watermark diagnostic

on:
  workflow_run:
    workflows: ["DrCloud OS SumUp merchant watermark production proof"]
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: drcloud-os-sumup-merchant-watermark-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    env:
      REVIEWED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Validate reviewed SHA
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out exact reviewed SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEWED_SHA }}

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          SSH_HOST_KEYS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/drcloud_deploy
          printf '%s\n' "$SSH_HOST_KEYS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/drcloud_deploy ~/.ssh/known_hosts

      - name: Capture bounded SumUp merchant watermark diagnosis
        id: capture
        continue-on-error: true
        env:
          OVH_SSH_HOST: ${{ secrets.OVH_SSH_HOST }}
          OVH_SSH_PORT: ${{ secrets.OVH_SSH_PORT }}
          OVH_SSH_USER: ${{ secrets.OVH_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/drcloud_deploy -p "${OVH_SSH_PORT:-22}" "$OVH_SSH_USER@$OVH_SSH_HOST" \
            "EXPECTED_DEPLOYED_SHA='$REVIEWED_SHA' bash -s" > sumup_merchant_watermark_diagnostic.json <<'REMOTE'
          set -Eeuo pipefail
          repo=/opt/drcloud-os
          expected_sha="${EXPECTED_DEPLOYED_SHA:-}"
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || { echo SUMUP_MERCHANT_DIAGNOSTIC_EXPECTED_SHA_INVALID >&2; exit 64; }
          source "$repo/deploy/ovh/deployment-environment.sh"
          exec 9>"${DRCLOUD_DEPLOY_LOCK:-/tmp/drcloud-os-deploy.lock}"
          flock 9
          deployed_sha="$(git -C "$repo" rev-parse HEAD)"
          [[ "$deployed_sha" == "$expected_sha" ]] || { echo SUMUP_MERCHANT_DIAGNOSTIC_DEPLOYED_SHA_MISMATCH >&2; exit 65; }
          cd "$repo/deploy/ovh"
          docker compose exec -T drcloud-os env -i \
            PATH=/usr/local/bin:/usr/bin:/bin \
            DRCLOUD_DATA_DIR=/data \
            EXPECTED_DEPLOYED_SHA="$expected_sha" \
            python - <<'PY'
          import json, os, re, sqlite3
          from pathlib import Path

          sha = os.environ.get('EXPECTED_DEPLOYED_SHA', '')
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('SUMUP_MERCHANT_DIAGNOSTIC_EXPECTED_SHA_INVALID')
          db_path = Path(os.environ.get('DRCLOUD_DATA_DIR', '/data')) / 'drcloud.db'
          if not db_path.is_file():
              raise SystemExit('SUMUP_MERCHANT_DIAGNOSTIC_LEDGER_MISSING')

          db = sqlite3.connect(f"{db_path.resolve().as_uri()}?mode=ro", uri=True)
          try:
              db.row_factory = sqlite3.Row
              required_tables = {'data_sources', 'sync_jobs', 'data_hub_sync_runs', 'sumup_merchants'}
              tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              if not required_tables <= tables:
                  raise SystemExit('SUMUP_MERCHANT_DIAGNOSTIC_SCHEMA_INCOMPLETE')

              source = db.execute("SELECT status,records_available,data_max_at FROM data_sources WHERE source_id='sumup_merchant'").fetchone()
              job = db.execute("SELECT status FROM sync_jobs WHERE job_id='sync_sumup_merchant' AND job_type='SUMUP_MERCHANT'").fetchone()
              run = db.execute("SELECT status,job_id FROM data_hub_sync_runs WHERE job_id='sync_sumup_merchant' ORDER BY run_id DESC LIMIT 1").fetchone()
              merchant = db.execute(
                  "SELECT count(*) AS n, "
                  "sum(CASE WHEN updated_at IS NOT NULL AND trim(updated_at)<>'' THEN 1 ELSE 0 END) AS with_updated, "
                  "max(updated_at) AS max_updated FROM sumup_merchants"
              ).fetchone()

              source_present = source is not None
              job_present = job is not None
              last_run_present = run is not None
              source_status = source['status'] if source else 'MISSING'
              job_status = job['status'] if job else 'MISSING'
              latest_run_succeeded = bool(run and run['status'] == 'SUCCEEDED' and run['job_id'] == 'sync_sumup_merchant')
              records_available = int(source['records_available'] or 0) if source else 0
              merchant_rows = int(merchant['n'] or 0)
              merchant_rows_with_provider_updated_at = int(merchant['with_updated'] or 0)
              all_rows_have_provider_updated_at = bool(merchant_rows > 0 and merchant_rows_with_provider_updated_at == merchant_rows)
              data_max_at_persisted = bool(source and source['data_max_at'])
              data_max_at_matches_provider_updated_at = bool(data_max_at_persisted and merchant['max_updated'] and source['data_max_at'] == merchant['max_updated'])

              if not source_present:
                  diagnosis = 'SOURCE_MISSING'
              elif source_status != 'CONNECTED':
                  diagnosis = 'SOURCE_NOT_CONNECTED'
              elif not job_present:
                  diagnosis = 'JOB_MISSING'
              elif job_status != 'SUCCEEDED':
                  diagnosis = 'JOB_NOT_SUCCEEDED'
              elif not last_run_present:
                  diagnosis = 'RUN_MISSING'
              elif not latest_run_succeeded:
                  diagnosis = 'LATEST_RUN_NOT_SUCCEEDED'
              elif records_available <= 0:
                  diagnosis = 'RECORDS_ZERO'
              elif merchant_rows <= 0:
                  diagnosis = 'LEDGER_EMPTY'
              elif not all_rows_have_provider_updated_at:
                  diagnosis = 'PROVIDER_UPDATED_AT_INCOMPLETE'
              elif not data_max_at_persisted:
                  diagnosis = 'DATA_MAX_AT_MISSING'
              elif not data_max_at_matches_provider_updated_at:
                  diagnosis = 'DATA_MAX_AT_MISMATCH'
              else:
                  diagnosis = 'READY'

              report = {
                  'schema_version': 1,
                  'environment': 'production',
                  'result': 'SUMUP_MERCHANT_WATERMARK_DIAGNOSTIC',
                  'deployed_sha': sha,
                  'evidence_status': 'MEASURABLE',
                  'diagnosis': diagnosis,
                  'provider_exhaustiveness_inferred': False,
                  'rpo_projection_authorized': False,
                  'imported_at_used_as_business_progress': False,
                  'evidence': {
                      'source_present': source_present,
                      'source_status': source_status,
                      'job_present': job_present,
                      'job_status': job_status,
                      'last_run_present': last_run_present,
                      'latest_run_succeeded': latest_run_succeeded,
                      'records_available_nonzero': records_available > 0,
                      'merchant_rows_nonzero': merchant_rows > 0,
                      'all_merchant_rows_have_provider_updated_at': all_rows_have_provider_updated_at,
                      'data_max_at_persisted': data_max_at_persisted,
                      'data_max_at_matches_provider_updated_at': data_max_at_matches_provider_updated_at,
                  },
                  'counts': {
                      'records_available': records_available,
                      'merchant_rows': merchant_rows,
                      'merchant_rows_with_provider_updated_at': merchant_rows_with_provider_updated_at,
                  },
                  'safety': {
                      'database_read_only': True,
                      'provider_network_calls': False,
                      'external_provider_auth': 'NONE',
                      'provider_mutations': False,
                      'timestamp_values_emitted': False,
                      'merchant_identifiers_emitted': False,
                      'provider_payloads_emitted': False,
                      'credentials_or_pii_emitted': False,
                  },
              }
              print(json.dumps(report, indent=2, sort_keys=True))
          finally:
              db.close()
          PY
          REMOTE
          test -s sumup_merchant_watermark_diagnostic.json

      - name: Upload sanitized diagnostic
        id: upload
        if: always() && hashFiles('sumup_merchant_watermark_diagnostic.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: drcloud-sumup-merchant-watermark-diagnostic-${{ github.run_id }}
          path: sumup_merchant_watermark_diagnostic.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce bounded diagnostic contract
        id: enforce
        if: always()
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          test "$CAPTURE_OUTCOME" = success
          test "$UPLOAD_OUTCOME" = success
          test -s sumup_merchant_watermark_diagnostic.json
          python - <<'PY'
          import json, os
          d = json.load(open('sumup_merchant_watermark_diagnostic.json'))
          assert d['schema_version'] == 1
          assert d['environment'] == 'production'
          assert d['result'] == 'SUMUP_MERCHANT_WATERMARK_DIAGNOSTIC'
          assert d['deployed_sha'] == os.environ['REVIEWED_SHA']
          assert d['evidence_status'] == 'MEASURABLE'
          assert d['diagnosis'] in {
              'SOURCE_MISSING', 'SOURCE_NOT_CONNECTED', 'JOB_MISSING', 'JOB_NOT_SUCCEEDED',
              'RUN_MISSING', 'LATEST_RUN_NOT_SUCCEEDED', 'RECORDS_ZERO', 'LEDGER_EMPTY',
              'PROVIDER_UPDATED_AT_INCOMPLETE', 'DATA_MAX_AT_MISSING', 'DATA_MAX_AT_MISMATCH', 'READY'
          }
          assert d['provider_exhaustiveness_inferred'] is False
          assert d['rpo_projection_authorized'] is False
          assert d['imported_at_used_as_business_progress'] is False
          assert set(d['evidence']) == {
              'source_present', 'source_status', 'job_present', 'job_status', 'last_run_present',
              'latest_run_succeeded', 'records_available_nonzero', 'merchant_rows_nonzero',
              'all_merchant_rows_have_provider_updated_at', 'data_max_at_persisted',
              'data_max_at_matches_provider_updated_at'
          }
          assert set(d['counts']) == {'records_available', 'merchant_rows', 'merchant_rows_with_provider_updated_at'}
          assert all(isinstance(v, int) and v >= 0 for v in d['counts'].values())
          assert d['safety'] == {
              'database_read_only': True,
              'provider_network_calls': False,
              'external_provider_auth': 'NONE',
              'provider_mutations': False,
              'timestamp_values_emitted': False,
              'merchant_identifiers_emitted': False,
              'provider_payloads_emitted': False,
              'credentials_or_pii_emitted': False,
          }
          PY

      - name: Index this run for connector discovery
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          ENFORCE_OUTCOME: ${{ steps.enforce.outcome }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python - <<'PY'
          import datetime, json, os
          conclusion = 'success' if (
              os.environ.get('CAPTURE_OUTCOME') == 'success' and
              os.environ.get('UPLOAD_OUTCOME') == 'success' and
              os.environ.get('ENFORCE_OUTCOME') == 'success'
          ) else 'failure'
          row = {
              'schema_version': 1,
              'workflow': 'DrCloud OS SumUp merchant watermark diagnostic',
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_number': int(os.environ['GITHUB_RUN_NUMBER']),
              'run_attempt': int(os.environ.get('GITHUB_RUN_ATTEMPT', '1')),
              'status': 'completed',
              'conclusion': conclusion,
              'event': os.environ.get('GITHUB_EVENT_NAME'),
              'head_branch': 'main',
              'head_sha': os.environ['REVIEWED_SHA'],
              'indexed_at': datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00', 'Z'),
              'run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'trigger_run_id': int(os.environ['TRIGGER_RUN_ID']),
          }
          body = '<!-- drcloud-run-index -->\n```json\n' + json.dumps(row, sort_keys=True) + '\n```'
          json.dump({'body': body}, open('run-index-payload.json', 'w'))
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/170/comments" --input run-index-payload.json
