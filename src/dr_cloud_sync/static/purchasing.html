<main class="dc-main purchasing-page"><header class="dc-page-header"><div><p class="dc-eyebrow">OPÉRATIONS</p><h1>Achats</h1><p>Fournisseurs et approvisionnement</p></div><button class="dc-button" id="newSupplier">Nouveau fournisseur</button></header><nav class="purchasing-tabs" aria-label="Sous-domaines Achats"><strong>Fournisseurs</strong><span>Commandes <small>À venir</small></span><span>Réceptions <small>À venir</small></span><span>Réassort <small>À venir</small></span></nav><section class="dc-card supplier-panel"><div class="supplier-tools"><label>Rechercher<input class="dc-input" id="supplierSearch" type="search" placeholder="Nom, contact, email ou téléphone"></label><label>Statut<select class="dc-select" id="supplierStatus"><option value="">Tous</option><option value="ACTIVE">Actifs</option><option value="INACTIVE">Inactifs</option><option value="ARCHIVED">Archivés</option></select></label></div><p class="dc-alert dc-alert-danger" id="supplierError" role="alert" hidden></p><div id="supplierContent" aria-live="polite"></div></section>
<dialog id="supplierDialog"><form method="dialog" id="supplierForm"><header><h2 id="formTitle">Nouveau fournisseur</h2><button value="cancel" aria-label="Fermer">×</button></header><input type="hidden" id="supplierId"><div class="supplier-form-grid"><label>Nom *<input class="dc-input" name="name" required maxlength="200"></label><label>Contact<input class="dc-input" name="contact_name" maxlength="200"></label><label>Email<input class="dc-input" name="email" type="email" maxlength="254"></label><label>Téléphone<input class="dc-input" name="phone" maxlength="50"></label><label>Site web<input class="dc-input" name="website" type="url" maxlength="500"></label><label>Adresse<input class="dc-input" name="address" maxlength="500"></label><label>Code postal<input class="dc-input" name="postal_code" maxlength="30"></label><label>Ville<input class="dc-input" name="city" maxlength="120"></label><label>Pays<input class="dc-input" name="country" maxlength="120"></label><label class="wide">Notes<textarea class="dc-input" name="notes" maxlength="5000"></textarea></label></div><p id="formError" class="dc-alert dc-alert-danger" role="alert" hidden></p><footer><button value="cancel" class="dc-button dc-button-secondary">Annuler</button><button value="save" class="dc-button">Enregistrer</button></footer></form></dialog><dialog id="detailDialog"><article id="supplierDetail"></article><form method="dialog"><button class="dc-button dc-button-secondary">Fermer</button></form></dialog></main>
