name: DrCloud OS Qonto transaction shape proof

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["DrCloud OS Production"]
    types: [completed]
permissions:
  contents: read
  issues: write
concurrency:
  group: drcloud-os-qonto-transaction-shape-proof
  cancel-in-progress: false
jobs:
  proof:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    env:
      REVIEWED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Validate reviewed SHA
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out exact reviewed SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEWED_SHA }}
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          SSH_HOST_KEYS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/drcloud_deploy
          printf '%s\n' "$SSH_HOST_KEYS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/drcloud_deploy ~/.ssh/known_hosts
      - name: Execute read-only Qonto transaction-shape proof
        id: proof
        continue-on-error: true
        env:
          OVH_SSH_HOST: ${{ secrets.OVH_SSH_HOST }}
          OVH_SSH_PORT: ${{ secrets.OVH_SSH_PORT }}
          OVH_SSH_USER: ${{ secrets.OVH_SSH_USER }}
        run: |
          set -euo pipefail
          remote_script="/tmp/drcloud-qonto-transaction-shape-proof-${GITHUB_RUN_ID}.sh"
          cleanup_remote() { ssh -i ~/.ssh/drcloud_deploy -p "${OVH_SSH_PORT:-22}" "$OVH_SSH_USER@$OVH_SSH_HOST" "rm -f -- '$remote_script'" >/dev/null 2>&1 || true; }
          trap cleanup_remote EXIT INT TERM
          scp -q -i ~/.ssh/drcloud_deploy -P "${OVH_SSH_PORT:-22}" deploy/ovh/production-qonto-transaction-shape-proof.sh "$OVH_SSH_USER@$OVH_SSH_HOST:$remote_script"
          ssh -i ~/.ssh/drcloud_deploy -p "${OVH_SSH_PORT:-22}" "$OVH_SSH_USER@$OVH_SSH_HOST" "chmod 700 '$remote_script' && EXPECTED_DEPLOYED_SHA='$REVIEWED_SHA' '$remote_script'" > qonto_transaction_shape_evidence.json
          test -s qonto_transaction_shape_evidence.json
          cleanup_remote
          trap - EXIT INT TERM
      - name: Upload sanitized evidence
        if: always() && hashFiles('qonto_transaction_shape_evidence.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: drcloud-qonto-transaction-shape-evidence-${{ github.run_id }}
          path: qonto_transaction_shape_evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce captured evidence
        id: enforce
        if: always()
        env:
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
        run: |
          set -euo pipefail
          test "$PROOF_OUTCOME" = success
          test -s qonto_transaction_shape_evidence.json
          python - <<'PY'
          import json,os
          d=json.load(open('qonto_transaction_shape_evidence.json'))
          assert d['schema_version']==1
          assert d['result']=='PRODUCTION_QONTO_TRANSACTION_SHAPE_CAPTURED'
          assert d['environment']=='production'
          assert d['deployed_sha']==os.environ['REVIEWED_SHA']
          s=d['qonto_transaction_shape']
          assert s['provider_exhaustiveness_inferred'] is False
          assert s['status'] in {'MEASURABLE','UNMEASURABLE'}
          if s['status']=='MEASURABLE':
              assert s['evidence_scope']=='LOCAL_LEDGER_ONLY'
              assert s['provider']=='Qonto'
              assert sum(s['direction_counts'].values())==s['transactions_total']
              assert sum(s['status_counts'].values())==s['transactions_total']
              c=s['credits']
              assert c['total']==s['direction_counts']['CREDIT']
              assert c['booked']>=0 and c['completed']>=0 and c['with_reference']>=0
          assert d['safety']['database_read_only'] is True
          assert d['safety']['provider_network_calls'] is False
          assert d['safety']['external_provider_auth']=='NONE'
          assert d['safety']['mutations'] is False
          assert d['safety']['row_level_identifiers_emitted'] is False
          assert d['safety']['reference_values_emitted'] is False
          PY
      - name: Index this run for connector discovery
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
          ENFORCE_OUTCOME: ${{ steps.enforce.outcome }}
          TRIGGER_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
        run: |
          python - <<'PY'
          import datetime,json,os
          conclusion='success' if os.environ.get('PROOF_OUTCOME')=='success' and os.environ.get('ENFORCE_OUTCOME')=='success' else 'failure'
          row={'schema_version':1,'workflow':'DrCloud OS Qonto transaction shape proof','run_id':int(os.environ['GITHUB_RUN_ID']),'run_number':int(os.environ['GITHUB_RUN_NUMBER']),'run_attempt':int(os.environ.get('GITHUB_RUN_ATTEMPT','1')),'status':'completed','conclusion':conclusion,'event':os.environ.get('GITHUB_EVENT_NAME'),'head_branch':'main','head_sha':os.environ['REVIEWED_SHA'],'indexed_at':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),'run_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}
          if os.environ.get('TRIGGER_RUN_ID'): row['trigger_run_id']=int(os.environ['TRIGGER_RUN_ID'])
          body='<!-- drcloud-run-index -->\n```json\n'+json.dumps(row,sort_keys=True)+'\n```'
          json.dump({'body':body},open('run-index-payload.json','w'))
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/170/comments" --input run-index-payload.json
