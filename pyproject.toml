[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dr-cloud-sync"
version = "1.0.0"
description = "Synchronisation PrestaShop maître vers le référentiel Dr Cloud Sync"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = []

[project.scripts]
dr-cloud-sync = "dr_cloud_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

