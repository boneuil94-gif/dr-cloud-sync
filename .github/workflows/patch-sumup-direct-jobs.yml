name: Apply bounded SumUp direct-job patch

on:
  push:
    branches: ["feat/sumup-merchant-readers-jobs"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, 'wire SumUp merchant and reader direct jobs') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sumup-merchant-readers-jobs
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: Install focused test dependencies
        run: pip install -e . pytest

      - name: Apply exact bounded source edits
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/dr_cloud_sync/inventory_web.py")
          text = path.read_text(encoding="utf-8")

          old_jobs = '''        self.data_hub.register_job(JobDefinition("sync_sumup_transactions","sumup_transactions","SUMUP_TRANSACTIONS",sumup_interval))\n        self.data_hub.register_job(JobDefinition("sync_sumup_payouts","sumup_payouts","SUMUP_PAYOUTS",sumup_interval,("sync_sumup_transactions",)))'''
          new_jobs = '''        self.data_hub.register_job(JobDefinition("sync_sumup_merchant","sumup_merchant","SUMUP_MERCHANT",sumup_interval))\n        self.data_hub.register_job(JobDefinition("sync_sumup_readers","sumup_readers","SUMUP_READERS",sumup_interval))\n        self.data_hub.register_job(JobDefinition("sync_sumup_transactions","sumup_transactions","SUMUP_TRANSACTIONS",sumup_interval))\n        self.data_hub.register_job(JobDefinition("sync_sumup_payouts","sumup_payouts","SUMUP_PAYOUTS",sumup_interval,("sync_sumup_transactions",)))'''
          if text.count(old_jobs) != 1:
              raise SystemExit("job registration anchor changed; refusing broad edit")
          text = text.replace(old_jobs, new_jobs, 1)

          marker = '''        intelligence=lambda cursor:{"rows_imported":self.marketing_intelligence.generate()["generated"]}\n'''
          helpers = '''        def sumup_merchant(cursor):\n            before=int(self.sumup_transactions.db.execute("SELECT count(*) FROM sumup_merchants").fetchone()[0])\n            payload=self.sumup_provider.merchant()\n            self.sumup_transactions.import_merchant(payload)\n            records=int(self.sumup_transactions.db.execute("SELECT count(*) FROM sumup_merchants").fetchone()[0])\n            return {"rows_imported":max(0,records-before),"records_available":records,"cursor":None}\n        def sumup_readers(cursor):\n            report=self.sumup_transactions.import_readers(self.sumup_provider.readers())\n            records=int(self.sumup_transactions.db.execute("SELECT count(*) FROM sumup_readers").fetchone()[0])\n            return {**report,"records_available":records}\n'''
          if text.count(marker) != 1:
              raise SystemExit("operation helper anchor changed; refusing broad edit")
          text = text.replace(marker, helpers + marker, 1)

          old_map = '''"PRESTASHOP_CATALOG":catalog,"BANK":bank,"SUMUP_TRANSACTIONS":lambda cursor:self.sumup_transactions.sync(self.sumup_provider,cursor)'''
          new_map = '''"PRESTASHOP_CATALOG":catalog,"BANK":bank,"SUMUP_MERCHANT":sumup_merchant,"SUMUP_READERS":sumup_readers,"SUMUP_TRANSACTIONS":lambda cursor:self.sumup_transactions.sync(self.sumup_provider,cursor)'''
          if text.count(old_map) != 1:
              raise SystemExit("operation map anchor changed; refusing broad edit")
          text = text.replace(old_map, new_map, 1)

          path.write_text(text, encoding="utf-8")
          PY
          git rm .github/workflows/patch-sumup-direct-jobs.yml

      - name: Run focused tests
        run: python -m pytest -q tests/test_sumup_connector.py tests/test_sumup_direct_jobs.py

      - name: Commit bounded patch and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dr_cloud_sync/inventory_web.py tests/test_sumup_direct_jobs.py
          git commit -m "feat: wire SumUp merchant and reader direct jobs"
          git push origin HEAD:feat/sumup-merchant-readers-jobs
