<main class="dc-main inventory-shell" aria-labelledby="moduleTitle">
<header class="dc-page-header inventory-heading"><div><p class="dc-eyebrow">Opérations</p><h1 id="moduleTitle">Inventaire</h1><p id="moduleDescription">Comptage, scan et validation des produits.</p></div><div class="stats" aria-live="polite"><strong id="ratio">0 / 478</strong><span id="remaining">478 restants</span><span id="percent">0 %</span></div></header>
<progress class="inventory-progress" id="progress" max="478" value="0"></progress>
<section class="dc-card scanner"><div class="modes" aria-label="Mode de comptage"><button id="quantityMode" class="active">Quantité</button><button id="plusMode">+1</button></div><label for="search">Scanner un produit</label><div class="scanrow"><input id="search" autofocus autocomplete="off" inputmode="search" placeholder="EAN ou nom…"><button id="camera" type="button" aria-label="Scanner un EAN avec la caméra">📷 <span>Scanner</span></button></div><div id="cameraPanel" class="camera-panel" hidden><video id="video" playsinline muted></video><button id="closeCamera" type="button">Fermer la caméra</button></div><p id="message" role="status" aria-live="polite"></p></section>
<section class="dc-card" id="selected" hidden><div id="selectedPicture"></div><h2 id="productName"></h2><dl id="details"></dl><ul id="diagnostics"></ul><form id="commercialForm" hidden><h3>Compléter la fiche</h3><label>Nom parent<input name="base_name"></label><label>Variante<input name="variant_name"></label><label>Référence<input name="reference"></label><label>EAN<input name="ean" inputmode="numeric"></label><button type="submit">Valider les informations commerciales</button></form><div id="missingEan" hidden><strong>EAN manquant</strong><label for="newEan">Scanner l'EAN</label><input id="newEan" inputmode="numeric"><button id="proposeEan">Associer cet EAN à ce produit</button><div id="eanConfirmation" hidden><p id="eanQuestion"></p><button id="cancelEan">Annuler</button><button id="confirmEan">Confirmer</button></div></div><button id="stocks">Afficher stocks théoriques</button><div id="stockValues" hidden></div><form id="countForm"><label for="quantity">Quantité physique</label><input id="quantity" type="number" min="0" step="1" required><button type="submit">✓ Enregistrer</button></form><form id="mediaForm" hidden><label>Image produit (JPEG, PNG ou WebP, 10 Mio max.)<input id="mediaFile" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"></label><button type="submit">Ajouter comme image principale</button></form></section>
<nav class="module-filters dc-card" aria-label="Filtres"><button data-view="ALL" class="active">Tous</button><button data-view="COUNTED">Comptés</button><button data-view="REMAINING">À compter</button><button id="noEan">Sans EAN</button></nav><section id="results" aria-live="polite"></section>
<section id="stockProposal" class="proposal" hidden><div class="itemhead"><div><p class="dc-eyebrow">Contrôle humain</p><h2>Proposition de mise à jour du stock</h2></div><strong id="proposalStatus">—</strong></div><p id="proposalSummary"></p><div id="proposalLines"></div><p id="proposalResult"></p><button id="applyProposal" type="button">Valider et appliquer</button></section>
<footer class="inventory-actions"><a href="/api/export.csv">Exporter CSV</a><a href="/api/report" download="rapport-inventaire-drcloud.json">Exporter JSON</a><button id="complete">Terminer le comptage</button><button id="newSession" hidden>Nouvelle session</button></footer></main>
