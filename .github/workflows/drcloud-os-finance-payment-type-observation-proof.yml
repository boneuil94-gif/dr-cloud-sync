name: DrCloud OS finance payment type observation proof

on:
  workflow_run:
    workflows: ["DrCloud OS Production"]
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: drcloud-os-finance-payment-type-observation-proof
  cancel-in-progress: false

jobs:
  proof:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    env:
      REVIEWED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Validate reviewed SHA
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out exact reviewed SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEWED_SHA }}
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          SSH_HOST_KEYS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/drcloud_deploy
          printf '%s\n' "$SSH_HOST_KEYS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/drcloud_deploy ~/.ssh/known_hosts
      - name: Execute deployment-locked read-only payment type observation proof
        id: proof
        continue-on-error: true
        env:
          OVH_SSH_HOST: ${{ secrets.OVH_SSH_HOST }}
          OVH_SSH_PORT: ${{ secrets.OVH_SSH_PORT }}
          OVH_SSH_USER: ${{ secrets.OVH_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/drcloud_deploy -p "${OVH_SSH_PORT:-22}" "$OVH_SSH_USER@$OVH_SSH_HOST" \
            "EXPECTED_DEPLOYED_SHA='$REVIEWED_SHA' bash -s" > payment_type_observation_evidence.json <<'REMOTE'
          set -Eeuo pipefail
          repo=/opt/drcloud-os
          expected_sha="${EXPECTED_DEPLOYED_SHA:-}"
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || { echo PAYMENT_TYPE_OBSERVATION_EXPECTED_SHA_INVALID >&2; exit 64; }
          source "$repo/deploy/ovh/deployment-environment.sh"
          exec 9>"${DRCLOUD_DEPLOY_LOCK:-/tmp/drcloud-os-deploy.lock}"
          flock 9
          deployed_sha="$(git -C "$repo" rev-parse HEAD)"
          [[ "$deployed_sha" == "$expected_sha" ]] || { echo PAYMENT_TYPE_OBSERVATION_DEPLOYED_SHA_MISMATCH >&2; exit 65; }
          cd "$repo/deploy/ovh"
          docker compose exec -T drcloud-os env -i \
            PATH=/usr/local/bin:/usr/bin:/bin \
            DRCLOUD_DATA_DIR=/data \
            EXPECTED_DEPLOYED_SHA="$expected_sha" \
            python - <<'PY'
          import json,os,re
          from pathlib import Path
          from dr_cloud_sync.finance_payment_type_observation import upstream_payment_type_observation
          sha=os.environ.get('EXPECTED_DEPLOYED_SHA','')
          if not re.fullmatch(r'[0-9a-f]{40}',sha): raise SystemExit('PAYMENT_TYPE_OBSERVATION_EXPECTED_SHA_INVALID')
          path=Path(os.environ.get('DRCLOUD_DATA_DIR','/data'))/'drcloud.db'
          evidence=upstream_payment_type_observation(path)
          if evidence.get('evidence_status') != 'MEASURABLE': raise SystemExit('PAYMENT_TYPE_OBSERVATION_EVIDENCE_UNAVAILABLE')
          report={
            'schema_version':1,
            'environment':'production',
            'result':'PRODUCTION_PAYMENT_TYPE_OBSERVATION_CAPTURED',
            'evidence_level':'PRODUCTION_READ_ONLY_LOCAL_LEDGER',
            'deployed_sha':sha,
            'payment_type_observation':evidence,
            'safety':{
              'database_read_only':True,
              'provider_network_calls':False,
              'external_provider_auth':'NONE',
              'mutations':False,
              'raw_payment_values_emitted':False,
              'row_level_ids_emitted':False,
              'business_timestamps_emitted':False,
              'provider_values_emitted':False,
              'sensitive_values_emitted':False,
            },
          }
          forbidden={'timestamp','captured_at','last_success_at','data_max_at','data_min_at','provider','cursor','error','message','payload','credential','secret','token','authorization','email','phone','amount','reference','transaction_id','account_id','payout_id','payment_id','sale_id','payment_type','name','description'}
          def scan(v):
            if isinstance(v,dict):
              for k,c in v.items():
                if str(k).lower() in forbidden: raise SystemExit('PAYMENT_TYPE_OBSERVATION_SENSITIVE_KEY')
                scan(c)
            elif isinstance(v,list):
              for c in v: scan(c)
          scan(report)
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
          REMOTE
          test -s payment_type_observation_evidence.json
      - name: Upload sanitized evidence
        if: always() && hashFiles('payment_type_observation_evidence.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: drcloud-finance-payment-type-observation-evidence-${{ github.run_id }}
          path: payment_type_observation_evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce captured evidence
        id: enforce
        if: always()
        env:
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
        run: |
          set -euo pipefail
          test "$PROOF_OUTCOME" = success
          test -s payment_type_observation_evidence.json
          python - <<'PY'
          import json,os
          d=json.load(open('payment_type_observation_evidence.json'))
          assert d['schema_version']==1
          assert d['result']=='PRODUCTION_PAYMENT_TYPE_OBSERVATION_CAPTURED'
          assert d['environment']=='production'
          assert d['deployed_sha']==os.environ['REVIEWED_SHA']
          e=d['payment_type_observation']
          assert e['schema_version']==1
          assert e['evidence_status']=='MEASURABLE'
          assert e['evidence_scope']=='LOCAL_LEDGER_ONLY'
          assert e['provider_exhaustiveness_inferred'] is False
          allowed_counts={
            'shopcaisse_payments','canonical_card','canonical_known_non_card','canonical_unknown_or_other',
            'raw_signal_none','raw_signal_any','raw_payment_type_present','raw_name_present','raw_description_present',
            'unknown_with_no_raw_signal','unknown_with_raw_signal','mapping_rule_missing','mapping_rule_unknown_label',
            'mapping_rule_recognized_payment_type','mapping_rule_recognized_name','mapping_rule_recognized_description',
            'mapping_rule_other_or_legacy','mapping_version_current','mapping_version_other_or_legacy',
            'unknown_current_mapping_version','unknown_other_or_legacy_mapping_version',
          }
          assert set(e['counts'])==allowed_counts
          assert all(isinstance(v,int) and v>=0 for v in e['counts'].values())
          assert e['safety']=={
            'database_read_only':True,'provider_network_calls':False,'external_provider_auth':'NONE',
            'mutations':False,'raw_payment_values_emitted':False,'provider_values_emitted':False,
            'row_level_ids_emitted':False,'sensitive_values_emitted':False,
          }
          s=d['safety']
          assert s['database_read_only'] is True
          assert s['provider_network_calls'] is False
          assert s['external_provider_auth']=='NONE'
          assert s['mutations'] is False
          assert s['raw_payment_values_emitted'] is False
          assert s['row_level_ids_emitted'] is False
          assert s['business_timestamps_emitted'] is False
          assert s['provider_values_emitted'] is False
          assert s['sensitive_values_emitted'] is False
          PY
      - name: Index this run for connector discovery
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
          ENFORCE_OUTCOME: ${{ steps.enforce.outcome }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python - <<'PY'
          import datetime,json,os
          conclusion='success' if os.environ.get('PROOF_OUTCOME')=='success' and os.environ.get('ENFORCE_OUTCOME')=='success' else 'failure'
          row={'schema_version':1,'workflow':'DrCloud OS finance payment type observation proof','run_id':int(os.environ['GITHUB_RUN_ID']),'run_number':int(os.environ['GITHUB_RUN_NUMBER']),'run_attempt':int(os.environ.get('GITHUB_RUN_ATTEMPT','1')),'status':'completed','conclusion':conclusion,'event':os.environ.get('GITHUB_EVENT_NAME'),'head_branch':'main','head_sha':os.environ['REVIEWED_SHA'],'indexed_at':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),'run_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",'trigger_run_id':int(os.environ['TRIGGER_RUN_ID'])}
          body='<!-- drcloud-run-index -->\n```json\n'+json.dumps(row,sort_keys=True)+'\n```'
          json.dump({'body':body},open('run-index-payload.json','w'))
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/170/comments" --input run-index-payload.json
