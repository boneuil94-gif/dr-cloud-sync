name: DrCloud OS finance group-composition-gap proof

on:
  workflow_run:
    workflows: ["DrCloud OS Production"]
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: drcloud-os-finance-group-composition-gap-proof
  cancel-in-progress: false

jobs:
  proof:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    env:
      REVIEWED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Validate reviewed SHA
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out exact reviewed SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEWED_SHA }}
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          SSH_HOST_KEYS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/drcloud_deploy
          printf '%s\n' "$SSH_HOST_KEYS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/drcloud_deploy ~/.ssh/known_hosts
      - name: Execute deployment-locked read-only group-composition-gap proof
        id: proof
        continue-on-error: true
        env:
          OVH_SSH_HOST: ${{ secrets.OVH_SSH_HOST }}
          OVH_SSH_PORT: ${{ secrets.OVH_SSH_PORT }}
          OVH_SSH_USER: ${{ secrets.OVH_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/drcloud_deploy -p "${OVH_SSH_PORT:-22}" "$OVH_SSH_USER@$OVH_SSH_HOST" \
            "EXPECTED_DEPLOYED_SHA='$REVIEWED_SHA' bash -s" > finance_group_composition_gap_evidence.json <<'REMOTE'
          set -Eeuo pipefail
          repo=/opt/drcloud-os
          expected_sha="${EXPECTED_DEPLOYED_SHA:-}"
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || { echo FINANCE_GROUP_COMPOSITION_GAP_EXPECTED_SHA_INVALID >&2; exit 64; }
          source "$repo/deploy/ovh/deployment-environment.sh"
          exec 9>"${DRCLOUD_DEPLOY_LOCK:-/tmp/drcloud-os-deploy.lock}"
          flock 9
          deployed_sha="$(git -C "$repo" rev-parse HEAD)"
          [[ "$deployed_sha" == "$expected_sha" ]] || { echo FINANCE_GROUP_COMPOSITION_GAP_DEPLOYED_SHA_MISMATCH >&2; exit 65; }
          cd "$repo/deploy/ovh"
          docker compose exec -T drcloud-os env -i \
            PATH=/usr/local/bin:/usr/bin:/bin \
            DRCLOUD_DATA_DIR=/data \
            EXPECTED_DEPLOYED_SHA="$expected_sha" \
            python - <<'PY'
          from __future__ import annotations
          import datetime,json,os,re
          from pathlib import Path
          from dr_cloud_sync.finance_group_composition_gap import group_composition_gap_funnel
          sha=os.environ.get('EXPECTED_DEPLOYED_SHA','')
          if not re.fullmatch(r'[0-9a-f]{40}',sha): raise SystemExit('FINANCE_GROUP_COMPOSITION_GAP_EXPECTED_SHA_INVALID')
          path=Path(os.environ.get('DRCLOUD_DATA_DIR','/data'))/'drcloud.db'
          evidence=group_composition_gap_funnel(path,bank_provider='qonto')
          report={
            'schema_version':1,
            'environment':'production',
            'result':'PRODUCTION_FINANCE_GROUP_COMPOSITION_GAP_CAPTURED',
            'evidence_level':'PRODUCTION_READ_ONLY_LOCAL_LEDGER',
            'captured_at':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),
            'deployed_sha':sha,
            'group_composition_gap_funnel':evidence,
            'safety':{'database_read_only':True,'provider_network_calls':False,'external_provider_auth':'NONE','mutations':False,'row_level_identifiers_emitted':False,'reference_values_emitted':False,'free_form_banking_data_emitted':False,'monetary_values_emitted':False,'deduction_values_emitted':False},
          }
          forbidden={'message','response_excerpt','request_id','cursor','account_id','transaction_id','payout_id','iban','reference','label','counterparty','secret','token','credential','api_key','authorization','email','phone','amount','fee'}
          def scan(v):
            if isinstance(v,dict):
              for k,c in v.items():
                if str(k).lower() in forbidden: raise SystemExit('FINANCE_GROUP_COMPOSITION_GAP_SENSITIVE_KEY')
                scan(c)
            elif isinstance(v,list):
              for c in v: scan(c)
          scan(report)
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
          REMOTE
          test -s finance_group_composition_gap_evidence.json
      - name: Upload sanitized evidence
        if: always() && hashFiles('finance_group_composition_gap_evidence.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: drcloud-finance-group-composition-gap-evidence-${{ github.run_id }}
          path: finance_group_composition_gap_evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce captured evidence
        id: enforce
        if: always()
        env:
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
        run: |
          set -euo pipefail
          test "$PROOF_OUTCOME" = success
          test -s finance_group_composition_gap_evidence.json
          python - <<'PY'
          import json,os
          d=json.load(open('finance_group_composition_gap_evidence.json'))
          assert d['schema_version']==1
          assert d['result']=='PRODUCTION_FINANCE_GROUP_COMPOSITION_GAP_CAPTURED'
          assert d['environment']=='production'
          assert d['deployed_sha']==os.environ['REVIEWED_SHA']
          f=d['group_composition_gap_funnel']
          assert f['provider_exhaustiveness_inferred'] is False
          assert f['status'] in {'MEASURABLE','NO_DATA','UNMEASURABLE'}
          s=d['safety']
          assert s['database_read_only'] is True
          assert s['provider_network_calls'] is False
          assert s['external_provider_auth']=='NONE'
          assert s['mutations'] is False
          assert s['row_level_identifiers_emitted'] is False
          assert s['reference_values_emitted'] is False
          assert s['free_form_banking_data_emitted'] is False
          assert s['monetary_values_emitted'] is False
          assert s['deduction_values_emitted'] is False
          PY
      - name: Index this run for connector discovery
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
          ENFORCE_OUTCOME: ${{ steps.enforce.outcome }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python - <<'PY'
          import datetime,json,os
          conclusion='success' if os.environ.get('PROOF_OUTCOME')=='success' and os.environ.get('ENFORCE_OUTCOME')=='success' else 'failure'
          row={'schema_version':1,'workflow':'DrCloud OS finance group-composition-gap proof','run_id':int(os.environ['GITHUB_RUN_ID']),'run_number':int(os.environ['GITHUB_RUN_NUMBER']),'run_attempt':int(os.environ.get('GITHUB_RUN_ATTEMPT','1')),'status':'completed','conclusion':conclusion,'event':os.environ.get('GITHUB_EVENT_NAME'),'head_branch':'main','head_sha':os.environ['REVIEWED_SHA'],'indexed_at':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),'run_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",'trigger_run_id':int(os.environ['TRIGGER_RUN_ID'])}
          body='<!-- drcloud-run-index -->\n```json\n'+json.dumps(row,sort_keys=True)+'\n```'
          json.dump({'body':body},open('run-index-payload.json','w'))
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/170/comments" --input run-index-payload.json
