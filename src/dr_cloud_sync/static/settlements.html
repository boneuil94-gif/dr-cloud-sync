<main class="dc-main settlements-cockpit">
  <header class="dc-page-header settlements-hero"><div><p class="dc-eyebrow">ShopCaisse → SumUp → payout → Qonto</p><h1>Cockpit Settlements</h1><p id="settlementPeriod">Période indisponible</p><div id="sourceFreshness" class="settlement-freshness"></div></div><div class="settlement-actions"><button id="syncSettlements" class="dc-button dc-button-primary">Synchroniser</button><button id="recomputeSettlements" class="dc-button dc-button-secondary">Recalculer</button><button id="backfillSettlements" class="dc-button dc-button-secondary">Backfill</button></div></header>
  <p id="settlementError" class="dc-alert dc-alert-danger" hidden></p>
  <section id="settlementKpis" class="settlement-kpis" aria-label="Indicateurs"></section>
  <section class="dc-card settlement-work"><div class="settlement-section-head"><div><p class="dc-eyebrow">Décisions prioritaires</p><h2>À traiter</h2></div><span id="anomalyCount" class="settlement-pill"></span></div><div id="settlementAnomalies"></div></section>
  <section class="dc-card"><div class="settlement-section-head"><div><p class="dc-eyebrow">Chaîne de preuve</p><h2>Rapprochements</h2></div><div class="settlement-filters"><input id="settlementSearch" type="search" placeholder="Ticket, transaction, payout…" aria-label="Rechercher"><select id="settlementStatus" aria-label="Filtrer le statut"><option value="">Tous les statuts</option><option>MATCHED</option><option>POSSIBLE</option><option>UNMATCHED</option><option>CONFLICT</option><option>REJECTED</option></select></div></div><div class="settlement-table-wrap"><table class="settlement-table"><thead><tr><th>Date</th><th>Source</th><th>Identifiant</th><th>Cible</th><th>Brut</th><th>Net / différence</th><th>Statut</th><th>Confiance</th><th>Actions</th></tr></thead><tbody id="settlementRows"></tbody></table></div><div id="settlementCards" class="settlement-mobile"></div><nav id="settlementPagination" class="settlement-pagination"></nav></section>
  <dialog id="settlementDrawer" class="settlement-drawer"><form method="dialog"><button class="dc-button dc-button-secondary">Fermer</button></form><div id="settlementDetail"></div></dialog>
</main>
