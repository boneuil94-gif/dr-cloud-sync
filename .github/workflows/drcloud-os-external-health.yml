name: DrCloud OS external health monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: drcloud-os-external-health
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe public health contract
        id: probe
        continue-on-error: true
        env:
          HEALTH_URL: https://osdrcloud.fr/health
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          url = os.environ["HEALTH_URL"]
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "drcloud-external-health/1"},
              method="GET",
          )
          try:
              with urllib.request.urlopen(request, timeout=10) as response:
                  if response.status != 200:
                      raise RuntimeError(f"unexpected HTTP status {response.status}")
                  payload = json.load(response)
          except Exception as exc:
              # Fail closed without echoing response bodies, headers, credentials or PII.
              raise SystemExit(f"EXTERNAL_HEALTH_PROBE_FAILED:{type(exc).__name__}") from None

          if payload.get("status") != "ok" or payload.get("database") != "ok":
              raise SystemExit("EXTERNAL_HEALTH_CONTRACT_FAILED")
          print("EXTERNAL_HEALTH_PROVEN")
          PY

      - name: Reconcile sanitized GitHub alert
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          ALERT_TITLE: "[alert] DrCloud OS external health probe failing"
        run: |
          set -euo pipefail
          open_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$ALERT_TITLE in:title" --json number,title --jq ".[] | select(.title == env.ALERT_TITLE) | .number" | head -n1)"
          if [[ "$PROBE_OUTCOME" != success ]]; then
            if [[ -z "$open_number" ]]; then
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "$ALERT_TITLE" \
                --body "Sanitized external health contract failed. No response body, headers, credentials or PII were captured. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
            fi
          elif [[ -n "$open_number" ]]; then
            gh issue close --repo "$GITHUB_REPOSITORY" "$open_number" \
              --comment "External health contract is green again. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          fi

      - name: Enforce external health
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: test "$PROBE_OUTCOME" = success
