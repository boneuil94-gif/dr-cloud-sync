name: DrCloud OS external health monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: drcloud-os-external-health
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe public health contract
        env:
          HEALTH_URL: https://osdrcloud.fr/health
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          url = os.environ["HEALTH_URL"]
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "drcloud-external-health/1"},
              method="GET",
          )
          try:
              with urllib.request.urlopen(request, timeout=10) as response:
                  if response.status != 200:
                      raise RuntimeError(f"unexpected HTTP status {response.status}")
                  payload = json.load(response)
          except Exception as exc:
              # Fail closed without echoing response bodies, headers, credentials or PII.
              raise SystemExit(f"EXTERNAL_HEALTH_PROBE_FAILED:{type(exc).__name__}") from None

          if payload.get("status") != "ok" or payload.get("database") != "ok":
              raise SystemExit("EXTERNAL_HEALTH_CONTRACT_FAILED")
          print("EXTERNAL_HEALTH_PROVEN")
          PY
