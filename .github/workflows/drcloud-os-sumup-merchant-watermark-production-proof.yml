name: DrCloud OS SumUp merchant watermark production proof

on:
  workflow_run:
    workflows: ["DrCloud OS Production"]
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: drcloud-os-sumup-merchant-watermark-production-proof
  cancel-in-progress: false

jobs:
  proof:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    env:
      REVIEWED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Validate reviewed SHA
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out exact reviewed SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEWED_SHA }}

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          SSH_HOST_KEYS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/drcloud_deploy
          printf '%s\n' "$SSH_HOST_KEYS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/drcloud_deploy ~/.ssh/known_hosts

      - name: Observe deployed SumUp merchant watermark read-only
        id: proof
        continue-on-error: true
        env:
          OVH_SSH_HOST: ${{ secrets.OVH_SSH_HOST }}
          OVH_SSH_PORT: ${{ secrets.OVH_SSH_PORT }}
          OVH_SSH_USER: ${{ secrets.OVH_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/drcloud_deploy -p "${OVH_SSH_PORT:-22}" "$OVH_SSH_USER@$OVH_SSH_HOST" \
            "EXPECTED_DEPLOYED_SHA='$REVIEWED_SHA' bash -s" > sumup_merchant_watermark_proof.json <<'REMOTE'
          set -Eeuo pipefail
          repo=/opt/drcloud-os
          expected_sha="${EXPECTED_DEPLOYED_SHA:-}"
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || { echo SUMUP_MERCHANT_WATERMARK_EXPECTED_SHA_INVALID >&2; exit 64; }
          source "$repo/deploy/ovh/deployment-environment.sh"
          exec 9>"${DRCLOUD_DEPLOY_LOCK:-/tmp/drcloud-os-deploy.lock}"
          flock 9
          deployed_sha="$(git -C "$repo" rev-parse HEAD)"
          [[ "$deployed_sha" == "$expected_sha" ]] || { echo SUMUP_MERCHANT_WATERMARK_DEPLOYED_SHA_MISMATCH >&2; exit 65; }
          cd "$repo/deploy/ovh"
          docker compose exec -T drcloud-os env -i \
            PATH=/usr/local/bin:/usr/bin:/bin \
            DRCLOUD_DATA_DIR=/data \
            EXPECTED_DEPLOYED_SHA="$expected_sha" \
            python - <<'PY'
          import json, os, re, sqlite3, time
          from pathlib import Path

          sha=os.environ.get('EXPECTED_DEPLOYED_SHA','')
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('SUMUP_MERCHANT_WATERMARK_EXPECTED_SHA_INVALID')
          db_path=Path(os.environ.get('DRCLOUD_DATA_DIR','/data'))/'drcloud.db'
          if not db_path.is_file():
              raise SystemExit('SUMUP_MERCHANT_WATERMARK_LEDGER_MISSING')

          def observe():
              db=sqlite3.connect(f"{db_path.resolve().as_uri()}?mode=ro", uri=True)
              try:
                  db.row_factory=sqlite3.Row
                  required_tables={'data_sources','sync_jobs','data_hub_sync_runs','sumup_merchants'}
                  tables={r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
                  if not required_tables <= tables:
                      raise SystemExit('SUMUP_MERCHANT_WATERMARK_SCHEMA_INCOMPLETE')
                  source=db.execute("SELECT status,records_available,data_max_at,last_run_id FROM data_sources WHERE source_id='sumup_merchant'").fetchone()
                  job=db.execute("SELECT status FROM sync_jobs WHERE job_id='sync_sumup_merchant' AND job_type='SUMUP_MERCHANT'").fetchone()
                  merchant=db.execute("SELECT count(*) AS n, sum(CASE WHEN updated_at IS NOT NULL AND trim(updated_at)<>'' THEN 1 ELSE 0 END) AS with_updated, max(updated_at) AS max_updated FROM sumup_merchants").fetchone()
                  run=None
                  if source and source['last_run_id'] is not None:
                      run=db.execute("SELECT status,job_id FROM data_hub_sync_runs WHERE run_id=?",(source['last_run_id'],)).fetchone()
                  records=int(source['records_available'] or 0) if source else 0
                  merchant_rows=int(merchant['n'] or 0)
                  merchant_with_updated=int(merchant['with_updated'] or 0)
                  persisted=bool(source and source['data_max_at'])
                  matches=bool(persisted and merchant['max_updated'] and source['data_max_at']==merchant['max_updated'])
                  return {
                      'source_present': source is not None,
                      'source_status': source['status'] if source else 'MISSING',
                      'job_present': job is not None,
                      'job_status': job['status'] if job else 'MISSING',
                      'last_run_present': run is not None,
                      'last_run_succeeded': bool(run and run['status']=='SUCCEEDED' and run['job_id']=='sync_sumup_merchant'),
                      'records_available': records,
                      'merchant_rows': merchant_rows,
                      'merchant_rows_with_provider_updated_at': merchant_with_updated,
                      'data_max_at_persisted': persisted,
                      'data_max_at_matches_provider_updated_at': matches,
                  }
              finally:
                  db.close()

          evidence=None
          for _ in range(24):
              evidence=observe()
              if (evidence['source_present'] and evidence['job_present'] and evidence['last_run_succeeded'] and
                  evidence['records_available']>0 and evidence['merchant_rows']>0 and
                  evidence['merchant_rows_with_provider_updated_at']==evidence['merchant_rows'] and
                  evidence['data_max_at_persisted'] and evidence['data_max_at_matches_provider_updated_at']):
                  break
              time.sleep(5)
          else:
              raise SystemExit('SUMUP_MERCHANT_WATERMARK_NOT_DURABLY_OBSERVED')

          report={
              'schema_version':1,
              'environment':'production',
              'result':'PRODUCTION_SUMUP_MERCHANT_WATERMARK_OBSERVED',
              'deployed_sha':sha,
              'evidence_status':'MEASURABLE',
              'provider_exhaustiveness_inferred':False,
              'imported_at_used_as_business_progress':False,
              'evidence':evidence,
              'safety':{
                  'database_read_only':True,
                  'provider_network_calls':False,
                  'external_provider_auth':'NONE',
                  'provider_mutations':False,
                  'timestamp_values_emitted':False,
                  'merchant_identifiers_emitted':False,
                  'provider_payloads_emitted':False,
                  'credentials_or_pii_emitted':False,
              },
          }
          forbidden={'data_max_at','updated_at','created_at','imported_at','merchant_code','merchant_id','raw_json','result_json','cursor','error','credential','secret','token','authorization','email','phone','address','iban','account_id','timestamp'}
          def scan(value):
              if isinstance(value,dict):
                  for key,child in value.items():
                      if str(key).lower() in forbidden:
                          raise SystemExit('SUMUP_MERCHANT_WATERMARK_SENSITIVE_KEY')
                      scan(child)
              elif isinstance(value,list):
                  for child in value: scan(child)
          # Safety metadata deliberately names protected concepts; scan evidence only.
          scan(report['evidence'])
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
          REMOTE
          test -s sumup_merchant_watermark_proof.json

      - name: Upload sanitized evidence
        id: upload
        if: always() && hashFiles('sumup_merchant_watermark_proof.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: drcloud-sumup-merchant-watermark-proof-${{ github.run_id }}
          path: sumup_merchant_watermark_proof.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce bounded evidence contract
        id: enforce
        if: always()
        env:
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          test "$PROOF_OUTCOME" = success
          test "$UPLOAD_OUTCOME" = success
          test -s sumup_merchant_watermark_proof.json
          python - <<'PY'
          import json,os
          d=json.load(open('sumup_merchant_watermark_proof.json'))
          assert d['schema_version']==1
          assert d['environment']=='production'
          assert d['result']=='PRODUCTION_SUMUP_MERCHANT_WATERMARK_OBSERVED'
          assert d['deployed_sha']==os.environ['REVIEWED_SHA']
          assert d['evidence_status']=='MEASURABLE'
          assert d['provider_exhaustiveness_inferred'] is False
          assert d['imported_at_used_as_business_progress'] is False
          e=d['evidence']
          assert set(e)=={'source_present','source_status','job_present','job_status','last_run_present','last_run_succeeded','records_available','merchant_rows','merchant_rows_with_provider_updated_at','data_max_at_persisted','data_max_at_matches_provider_updated_at'}
          assert e['source_present'] is True
          assert e['job_present'] is True
          assert e['last_run_present'] is True
          assert e['last_run_succeeded'] is True
          assert e['records_available']>0
          assert e['merchant_rows']>0
          assert e['merchant_rows_with_provider_updated_at']==e['merchant_rows']
          assert e['data_max_at_persisted'] is True
          assert e['data_max_at_matches_provider_updated_at'] is True
          s=d['safety']
          assert s=={
              'database_read_only':True,
              'provider_network_calls':False,
              'external_provider_auth':'NONE',
              'provider_mutations':False,
              'timestamp_values_emitted':False,
              'merchant_identifiers_emitted':False,
              'provider_payloads_emitted':False,
              'credentials_or_pii_emitted':False,
          }
          PY

      - name: Index this run for connector discovery
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          ENFORCE_OUTCOME: ${{ steps.enforce.outcome }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python - <<'PY'
          import datetime,json,os
          conclusion='success' if os.environ.get('PROOF_OUTCOME')=='success' and os.environ.get('UPLOAD_OUTCOME')=='success' and os.environ.get('ENFORCE_OUTCOME')=='success' else 'failure'
          row={'schema_version':1,'workflow':'DrCloud OS SumUp merchant watermark production proof','run_id':int(os.environ['GITHUB_RUN_ID']),'run_number':int(os.environ['GITHUB_RUN_NUMBER']),'run_attempt':int(os.environ.get('GITHUB_RUN_ATTEMPT','1')),'status':'completed','conclusion':conclusion,'event':os.environ.get('GITHUB_EVENT_NAME'),'head_branch':'main','head_sha':os.environ['REVIEWED_SHA'],'indexed_at':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),'run_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",'trigger_run_id':int(os.environ['TRIGGER_RUN_ID'])}
          body='<!-- drcloud-run-index -->\n```json\n'+json.dumps(row,sort_keys=True)+'\n```'
          json.dump({'body':body},open('run-index-payload.json','w'))
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/170/comments" --input run-index-payload.json
