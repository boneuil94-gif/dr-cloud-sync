<main class="dc-main inventory-shell" aria-labelledby="moduleTitle">
<header class="dc-page-header inventory-heading"><div><p class="dc-eyebrow">Opérations</p><h1 id="moduleTitle">Inventaire</h1><p id="moduleDescription">Comptage, scan et validation des produits.</p></div><div class="stats" aria-live="polite"><strong id="ratio">0 / 478</strong><span id="remaining">478 restants</span><span id="percent">0 %</span></div></header>
<progress class="inventory-progress" id="progress" max="478" value="0"></progress>
<section class="dc-card scanner"><div class="modes" aria-label="Mode de comptage"><button id="quantityMode" class="active">Quantité</button><button id="plusMode">+1</button></div><label for="search">Scanner un produit</label><div class="scanrow"><input id="search" autofocus autocomplete="off" inputmode="search" placeholder="EAN ou nom…"><button id="camera" title="Scanner avec la caméra" aria-label="Scanner avec la caméra">📷</button></div><video id="video" hidden playsinline></video><p id="message" role="status"></p></section>
<section class="dc-card" id="selected" hidden><h2 id="productName"></h2><dl id="details"></dl><div id="missingEan" hidden><strong>EAN manquant</strong><label for="newEan">Scanner l'EAN</label><input id="newEan" inputmode="numeric"><button id="proposeEan">Associer un EAN</button><div id="eanConfirmation" hidden><p id="eanQuestion"></p><button id="cancelEan">Annuler</button><button id="confirmEan">Confirmer</button></div></div><button id="stocks">Afficher stocks théoriques</button><div id="stockValues" hidden></div><form id="countForm"><label for="quantity">Quantité physique</label><input id="quantity" type="number" min="0" step="1" required><button type="submit">✓ Enregistrer</button></form></section>
<nav class="module-filters dc-card" aria-label="Filtres"><button data-view="ALL" class="active">Tous</button><button data-view="COUNTED">Comptés</button><button data-view="REMAINING">À compter</button><button id="noEan">Sans EAN</button></nav><section id="results" aria-live="polite"></section>
<footer class="inventory-actions"><a href="/api/export.csv">Exporter CSV</a><a href="/api/report" download="rapport-inventaire-drcloud.json">Exporter JSON</a><button id="complete">Terminer le comptage</button></footer></main>
