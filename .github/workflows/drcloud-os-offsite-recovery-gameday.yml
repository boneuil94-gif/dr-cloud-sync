name: DrCloud OS remote-only recovery Game Day

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["DrCloud OS encrypted offsite backup"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: drcloud-os-offsite-recovery-gameday
  cancel-in-progress: false
jobs:
  recovery:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          SSH_HOST_KEYS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh; printf '%s\n' "$SSH_KEY" > ~/.ssh/drcloud_deploy; printf '%s\n' "$SSH_HOST_KEYS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/drcloud_deploy ~/.ssh/known_hosts
      - name: Execute isolated remote-only restore
        id: gameday
        continue-on-error: true
        env:
          OVH_SSH_HOST: ${{ secrets.OVH_SSH_HOST }}
          OVH_SSH_PORT: ${{ secrets.OVH_SSH_PORT }}
          OVH_SSH_USER: ${{ secrets.OVH_SSH_USER }}
          DRCLOUD_RESTIC_IMAGE: ${{ vars.DRCLOUD_RESTIC_IMAGE }}
          OFFSITE_RESTIC_REPOSITORY: ${{ vars.OFFSITE_RESTIC_REPOSITORY }}
          OFFSITE_S3_REGION: ${{ vars.OFFSITE_S3_REGION }}
          OFFSITE_S3_ENDPOINT: ${{ vars.OFFSITE_S3_ENDPOINT }}
          OFFSITE_RESTIC_PASSWORD: ${{ secrets.OFFSITE_RESTIC_PASSWORD }}
          OFFSITE_S3_ACCESS_KEY_ID: ${{ secrets.OFFSITE_S3_ACCESS_KEY_ID }}
          OFFSITE_S3_SECRET_ACCESS_KEY: ${{ secrets.OFFSITE_S3_SECRET_ACCESS_KEY }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os,shlex
          names=("DRCLOUD_RESTIC_IMAGE","OFFSITE_RESTIC_REPOSITORY","OFFSITE_S3_REGION","OFFSITE_S3_ENDPOINT","OFFSITE_RESTIC_PASSWORD","OFFSITE_S3_ACCESS_KEY_ID","OFFSITE_S3_SECRET_ACCESS_KEY")
          open("offsite-runtime.env","w").write("".join(f"export {n}={shlex.quote(os.environ.get(n,''))}\n" for n in names))
          PY
          chmod 600 offsite-runtime.env
          script="/tmp/drcloud-offsite-gameday-${RUN_ID}.sh"; runtime="/tmp/drcloud-offsite-runtime-${RUN_ID}.env"
          cleanup_remote() { ssh -i ~/.ssh/drcloud_deploy -p "${OVH_SSH_PORT:-22}" "$OVH_SSH_USER@$OVH_SSH_HOST" "rm -f -- '$script' '$runtime'" >/dev/null 2>&1 || true; rm -f offsite-runtime.env; }
          trap cleanup_remote EXIT INT TERM
          scp -q -i ~/.ssh/drcloud_deploy -P "${OVH_SSH_PORT:-22}" deploy/ovh/offsite-recovery-gameday.sh "$OVH_SSH_USER@$OVH_SSH_HOST:$script"
          scp -q -i ~/.ssh/drcloud_deploy -P "${OVH_SSH_PORT:-22}" offsite-runtime.env "$OVH_SSH_USER@$OVH_SSH_HOST:$runtime"; rm -f offsite-runtime.env
          ssh -i ~/.ssh/drcloud_deploy -p "${OVH_SSH_PORT:-22}" "$OVH_SSH_USER@$OVH_SSH_HOST" "bash -s" -- "$script" "$runtime" <<'REMOTE'
          set -euo pipefail; script="$1"; runtime="$2"
          cleanup() { rm -f -- "$script"; command -v shred >/dev/null && shred -u -- "$runtime" || rm -f -- "$runtime"; }
          trap cleanup EXIT INT TERM; chmod 700 "$script"; chmod 600 "$runtime"; source "$runtime"; "$script"
          cleanup; trap - EXIT INT TERM; test ! -e "$runtime" && test ! -e "$script"
          REMOTE
          cleanup_remote; trap - EXIT INT TERM
      - name: Download sanitized evidence only
        if: always()
        env:
          OVH_SSH_HOST: ${{ secrets.OVH_SSH_HOST }}
          OVH_SSH_PORT: ${{ secrets.OVH_SSH_PORT }}
          OVH_SSH_USER: ${{ secrets.OVH_SSH_USER }}
        run: scp -q -i ~/.ssh/drcloud_deploy -P "${OVH_SSH_PORT:-22}" "$OVH_SSH_USER@$OVH_SSH_HOST:/opt/drcloud-os/deploy/ovh/.deployment-state/offsite_recovery_evidence_production.json" offsite_recovery_evidence_production.json
      - name: Upload sanitized evidence
        if: always() && hashFiles('offsite_recovery_evidence_production.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: drcloud-offsite-recovery-evidence-${{ github.run_id }}
          path: offsite_recovery_evidence_production.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce proof
        if: always()
        env:
          STEP_OUTCOME: ${{ steps.gameday.outcome }}
        run: |
          test "$STEP_OUTCOME" = success
          python -c 'import json; d=json.load(open("offsite_recovery_evidence_production.json")); assert d["restore"]["result"]=="OFFSITE_RESTORE_PROVEN" and d["restore"]["app_boot"]=="APP_BOOT_OK" and d["restore"]["health"]=="HEALTH_OK" and not d["safety"]["local_backup_used_for_restore"]'
