name: DrCloud OS Production
on:
  workflow_run:
    workflows: ["DrCloud OS CI"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: drcloud-os-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out the exact successful commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Configure dedicated SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_SSH_HOST: ${{ secrets.OVH_SSH_HOST }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/drcloud_deploy
          chmod 600 ~/.ssh/drcloud_deploy
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Stage the reviewed runtime configuration installer
        env:
          OVH_SSH_HOST: ${{ secrets.OVH_SSH_HOST }}
          OVH_SSH_PORT: ${{ secrets.OVH_SSH_PORT }}
          OVH_SSH_USER: ${{ secrets.OVH_SSH_USER }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          scp -q -i ~/.ssh/drcloud_deploy -P "${OVH_SSH_PORT:-22}" \
            deploy/ovh/configure-prestashop-env.sh \
            "$OVH_SSH_USER@$OVH_SSH_HOST:/tmp/drcloud-prestashop-$DEPLOY_SHA.sh"
          scp -q -i ~/.ssh/drcloud_deploy -P "${OVH_SSH_PORT:-22}" \
            deploy/ovh/configure-connectors-env.sh \
            "$OVH_SSH_USER@$OVH_SSH_HOST:/tmp/drcloud-connectors-$DEPLOY_SHA.sh"
          scp -q -i ~/.ssh/drcloud_deploy -P "${OVH_SSH_PORT:-22}" \
            deploy/ovh/configure-shopcaisse-env.sh \
            "$OVH_SSH_USER@$OVH_SSH_HOST:/tmp/drcloud-shopcaisse-$DEPLOY_SHA.sh"
          scp -q -i ~/.ssh/drcloud_deploy -P "${OVH_SSH_PORT:-22}" \
            deploy/ovh/configure-sumup-env.sh \
            "$OVH_SSH_USER@$OVH_SSH_HOST:/tmp/drcloud-sumup-$DEPLOY_SHA.sh"
      - name: Deploy the exact successful commit
        env:
          OVH_SSH_HOST: ${{ secrets.OVH_SSH_HOST }}
          OVH_SSH_PORT: ${{ secrets.OVH_SSH_PORT }}
          OVH_SSH_USER: ${{ secrets.OVH_SSH_USER }}
          PRESTASHOP_API_KEY: ${{ secrets.PRESTASHOP_API_KEY }}
          PRESTASHOP_PAID_STATE_IDS: ${{ secrets.PRESTASHOP_PAID_STATE_IDS }}
          SHOPCAISSE_API_KEY: ${{ secrets.SHOPCAISSE_API_KEY }}
          QONTO_CREDENTIAL: ${{ secrets.QONTO_CREDENTIAL }}
          SUMUP_API_KEY: ${{ secrets.SUMUP_API_KEY }}
          SUMUP_MERCHANT_CODE: ${{ vars.SUMUP_MERCHANT_CODE }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test -n "$PRESTASHOP_API_KEY" || { echo "PRESTASHOP_API_KEY est absent" >&2; exit 1; }
          test -n "$PRESTASHOP_PAID_STATE_IDS" || { echo "PRESTASHOP_PAID_STATE_IDS est absent" >&2; exit 1; }
          test -n "$SHOPCAISSE_API_KEY" || { echo "SHOPCAISSE_API_KEY est absent" >&2; exit 1; }
          test -n "$SUMUP_API_KEY" || { echo "SUMUP_API_KEY est absent" >&2; exit 1; }
          test -n "$SUMUP_MERCHANT_CODE" || { echo "SUMUP_MERCHANT_CODE est absent" >&2; exit 1; }
          printf '%s\n%s\n%s\n' 'https://dr-cloudshop.com/api' "$PRESTASHOP_API_KEY" "$PRESTASHOP_PAID_STATE_IDS" |
            ssh -i ~/.ssh/drcloud_deploy -p "${OVH_SSH_PORT:-22}" \
              "$OVH_SSH_USER@$OVH_SSH_HOST" \
              "DRCLOUD_ENV_FILE=/opt/drcloud-os/deploy/ovh/drcloud.env \
               /bin/bash /tmp/drcloud-prestashop-$DEPLOY_SHA.sh; \
               status=\$?; rm -f /tmp/drcloud-prestashop-$DEPLOY_SHA.sh; exit \$status"
          printf '%s\n' "$SHOPCAISSE_API_KEY" |
            ssh -i ~/.ssh/drcloud_deploy -p "${OVH_SSH_PORT:-22}" \
              "$OVH_SSH_USER@$OVH_SSH_HOST" \
              "DRCLOUD_ENV_FILE=/opt/drcloud-os/deploy/ovh/drcloud.env \
               /bin/bash /tmp/drcloud-shopcaisse-$DEPLOY_SHA.sh; \
               status=\$?; rm -f /tmp/drcloud-shopcaisse-$DEPLOY_SHA.sh; exit \$status"
          printf '%s\n%s\n' "$SUMUP_API_KEY" "$SUMUP_MERCHANT_CODE" |
            ssh -i ~/.ssh/drcloud_deploy -p "${OVH_SSH_PORT:-22}" "$OVH_SSH_USER@$OVH_SSH_HOST" \
              "DRCLOUD_ENV_FILE=/opt/drcloud-os/deploy/ovh/drcloud.env /bin/bash /tmp/drcloud-sumup-$DEPLOY_SHA.sh; status=\$?; rm -f /tmp/drcloud-sumup-$DEPLOY_SHA.sh; exit \$status"
          if test -n "$QONTO_CREDENTIAL"; then
            printf '%s\n%s\n' "$QONTO_CREDENTIAL" '/data/shopcaisse-inbox' |
              ssh -i ~/.ssh/drcloud_deploy -p "${OVH_SSH_PORT:-22}" "$OVH_SSH_USER@$OVH_SSH_HOST" \
                "DRCLOUD_ENV_FILE=/opt/drcloud-os/deploy/ovh/drcloud.env /bin/bash /tmp/drcloud-connectors-$DEPLOY_SHA.sh"
          fi
          ssh -i ~/.ssh/drcloud_deploy -p "${OVH_SSH_PORT:-22}" "$OVH_SSH_USER@$OVH_SSH_HOST" \
            "rm -f /tmp/drcloud-connectors-$DEPLOY_SHA.sh"
          ssh -i ~/.ssh/drcloud_deploy -p "${OVH_SSH_PORT:-22}" \
            "$OVH_SSH_USER@$OVH_SSH_HOST" \
            "test \"\$(id -un)\" = '$OVH_SSH_USER' && /opt/drcloud-os/deploy/ovh/update.sh '$DEPLOY_SHA'"
