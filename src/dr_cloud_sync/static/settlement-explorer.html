<main class="dc-main settlements-cockpit explorer">
<header class="dc-page-header settlements-hero"><div><p class="dc-eyebrow">ShopCaisse → SumUp → payout → Qonto</p><h1>Settlement Explorer</h1><p>Recherchez et expliquez chaque règlement de bout en bout.</p><p id="explorerPeriod">Période analysée : —</p></div><div class="settlement-actions"><a class="dc-button dc-button-secondary" href="/settlements">Cockpit</a><button id="explorerSync" class="dc-button dc-button-primary">Synchroniser</button><button id="explorerRecompute" class="dc-button dc-button-secondary">Recalculer</button></div></header>
<div id="explorerToast" class="settlement-toast" role="status" aria-live="polite"></div>
<section id="freshness" class="explorer-freshness" aria-label="Fraîcheur des sources"></section>
<nav class="settlement-tabs" aria-label="Vues Explorer"><button class="active" data-mode="explorer">Tous</button><button data-mode="anomalies">Anomalies</button><button data-mode="transactions">Transactions</button><button data-mode="payouts">Payouts</button><button data-mode="qonto">Qonto</button></nav>
<section class="dc-card"><form id="explorerFilters" class="explorer-filters" role="search"><label class="wide">Recherche globale<input name="q" type="search" autocomplete="off" placeholder="Ticket, transaction, payout, Qonto, montant, date ou note"></label><label>Du<input name="from" type="date"></label><label>Au<input name="to" type="date"></label><label>Montant min.<input name="amount_min" type="number" step=".01"></label><label>Montant max.<input name="amount_max" type="number" step=".01"></label><label>Devise<select name="currency"><option value="">Toutes</option><option>EUR</option></select></label><label>Statut<select name="status"><option value="">Tous</option><option>MATCHED</option><option>POSSIBLE</option><option>UNMATCHED</option><option>CONFLICT</option><option>REJECTED</option></select></label><label>Confiance<select name="confidence"><option value="">Toutes</option><option value="high">Élevée</option><option value="medium">Moyenne</option><option value="low">Faible</option></select></label><label>Ticket<select name="has_ticket"><option value="">Tous</option><option value="true">Avec</option><option value="false">Sans</option></select></label><label>Qonto<select name="has_qonto"><option value="">Tous</option><option value="true">Avec</option><option value="false">Sans</option></select></label><button type="reset" class="dc-button dc-button-secondary">Réinitialiser</button></form><div id="explorerChips" class="settlement-chips" aria-live="polite"></div></section>
<section class="dc-card"><div class="settlement-section-head"><h2>Résultats <span id="explorerCount" class="settlement-pill"></span></h2><label>Trier par <select id="explorerSort"><option value="date">Date</option><option value="amount">Montant</option><option value="confidence">Confiance</option><option value="difference">Différence</option><option value="status">Statut</option></select></label></div><div id="explorerEmpty" class="settlement-empty" hidden></div><div class="settlement-table-wrap"><table class="settlement-table"><thead><tr><th>Date</th><th>Ticket / paiement</th><th>Transaction SumUp</th><th>Payout</th><th>Crédit Qonto</th><th>Brut</th><th>Frais</th><th>Net</th><th>Différence</th><th>Statut</th><th>Confiance</th><th>Anomalie</th><th>Actions</th></tr></thead><tbody id="explorerRows"></tbody></table></div><div id="explorerCards" class="settlement-mobile"></div><nav id="explorerPagination" class="settlement-pagination" aria-label="Pagination des résultats"></nav></section>
<dialog id="explorerDrawer" class="settlement-drawer" aria-labelledby="explorerDetailTitle"><div class="drawer-head"><h2 id="explorerDetailTitle">Chaîne de règlement</h2><button id="closeExplorer" class="dc-button dc-button-secondary" aria-label="Fermer le détail">Fermer</button></div><div id="explorerDetail"></div></dialog>
</main>
